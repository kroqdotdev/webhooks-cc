openapi: "3.1.0"
info:
  title: webhooks.cc API
  version: "1.0.0"
  description: |
    REST API for webhooks.cc: capture, inspect, and test webhooks and email.

    **Authentication:** Most endpoints require a Bearer token in the `Authorization` header.
    Use your API key (prefix `whcc_`) generated on the [API keys page](https://webhooks.cc/account/api-keys),
    or an access token from OAuth 2.1 (authorization code with PKCE, for apps and MCP clients acting
    for a signed-in user). Agents without a human at hand can register themselves (see
    [auth.md](https://webhooks.cc/auth.md)) and exchange the identity assertion for access tokens.
    Every access token is an ordinary `whcc_` bearer token and goes in the same header.
    Public endpoints (`/api/stats`, `/api/health`, agent registration and the OAuth endpoints) do not
    require authentication.

    **MCP server:** The same API is available to AI agents as a remote MCP server (streamable
    HTTP, not described here) at `https://webhooks.cc/mcp`, with the same bearer tokens; its
    protected resource metadata is at `https://webhooks.cc/.well-known/oauth-protected-resource/mcp`.

    **Webhook receiver:** Send webhooks to `https://go.webhooks.cc/w/{slug}`. They are captured
    and available via the API and dashboard in real time.

    **Email capture:** Every endpoint that belongs to an account also receives email at
    `{slug}@mailhooks.cc` (and `{slug}+tag@mailhooks.cc`). An email is stored as a request with
    `kind: "email"` and `method: "EMAIL"`. See [Email capture](https://webhooks.cc/docs/email-capture)
    and [Email forwarding](https://webhooks.cc/docs/forwarding).

    **Rate limits:** Rate-limited endpoints return `X-RateLimit-Limit`, `X-RateLimit-Remaining`,
    and `X-RateLimit-Reset` headers on every response. When the limit is exceeded, the API
    returns `429` with a `Retry-After` header.
  contact:
    name: webhooks.cc
    url: https://webhooks.cc/support
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://webhooks.cc
    description: Production

security:
  - BearerAuth: []
  - OAuth2: [webhooks:read, webhooks:write]

tags:
  - name: Endpoints
    description: Create, read, update, and delete webhook endpoints.
  - name: Requests
    description: List, inspect, and clear captured webhook requests and emails.
  - name: Forwarding
    description: |
      Send what an endpoint captures, HTTP requests and emails, to up to 10 destinations: relayed
      as received, as signed JSON (Standard Webhooks headers), as a JSON body you shape with
      placeholders, as a chat message, as Google Sheets rows or as files on your own server. Each
      destination has its own kinds, filter, format, timing and signing secret. Only the
      endpoint's owner can configure it. The endpoint's `forward*` fields and the
      `/api/endpoints/{slug}/forwarding` routes are the older single-URL API: they still work and
      stand for the endpoint's primary destination. See https://webhooks.cc/docs/forwarding.
  - name: Streaming
    description: Real-time Server-Sent Events stream of incoming webhooks.
  - name: Search
    description: Search retained requests across your endpoints and endpoints shared with you through teams.
  - name: Send
    description: Send test webhooks to your endpoints.
  - name: Usage
    description: Request quota and billing information.
  - name: Teams
    description: Team management and endpoint sharing. Any account can create a team; the team needs its own Teams subscription before it can invite members or share endpoints.
  - name: Invites
    description: Team invitation management.
  - name: Sharing
    description: |
      `whk share` previews of local ports at `<name>.sharehooks.cc` and `whk tunnel --live`
      sessions: list and stop them, read a preview's visitor log, and manage reserved names. The
      CLI starts a share (it holds the tunnel); everything else is here, so an agent never needs
      the dashboard. Every route answers 503 where sharing is not set up. Tokens of an unclaimed
      agent sandbox get 403. See https://webhooks.cc/docs/share.
  - name: Agents
    description: |
      Agent registration (auth.md v0.6, documented at https://webhooks.cc/auth.md) and the agent
      sandbox. An agent registers without a human, works in a small sandbox with a pre-claim token,
      and is later claimed into a human's account, after which it uses the normal API.
  - name: Account
    description: |
      The account's API keys, connected agents, share links to requests, custom inbound domains
      and display name. Reads and revokes act at once. A new API key, a new share link, removing
      a domain and a rename are only for the account's owner to allow: with an API key or agent
      token the route answers 202 with an approval, the owner approves it on the page at its
      `url`, and the asker polls `GET /api/approvals/{id}` for the result. See
      https://webhooks.cc/docs/agents#approvals.
  - name: OAuth
    description: |
      OAuth 2.1 token, revocation and dynamic client registration endpoints. Server metadata is
      published at https://webhooks.cc/.well-known/oauth-authorization-server (RFC 8414).

paths:
  # -- Endpoints ---------------------------------------------------------------

  /api/endpoints:
    get:
      operationId: listEndpoints
      tags: [Endpoints]
      summary: List endpoints
      description: |
        Returns all endpoints owned by the authenticated user (`owned`, each with
        `sharedWith`), plus endpoints shared with them through a team that has an
        active Teams subscription (`shared`, each with `fromTeam`). Personal plans
        do not affect team access.
      responses:
        "200":
          description: Endpoint listing
          content:
            application/json:
              schema:
                type: object
                required: [owned, shared]
                properties:
                  owned:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
                  shared:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createEndpoint
      tags: [Endpoints]
      summary: Create endpoint
      description: |
        Create a new webhook endpoint. Rate limited to 30 requests per 10 minutes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "200":
          description: Created endpoint
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: getEndpoint
      tags: [Endpoints]
      summary: Get endpoint
      description: |
        Returns a single endpoint by slug. Team members can access shared endpoints; for them
        `notificationUrl` and `forwardUrl` are left out.
      responses:
        "200":
          description: Endpoint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateEndpoint
      tags: [Endpoints]
      summary: Update endpoint
      description: |
        Update an endpoint. Only the fields you send change.
        Set `mockResponse` to `null` to clear the mock response.

        Team members can update `name`, `mockResponse`, and `responseRules` on endpoints shared
        with them. Only the owner can change `showEmailExtracts` (it also decides whether forwarded
        JSON includes codes and links), `site`, `notificationUrl`, the signing settings,
        `forwardEnabled`, and `forwardUrl`; anyone else who sends one gets `403`.

        **Forwarding:** `forwardEnabled: true` needs a `forwardUrl`, sent in the same request or
        saved before. Saving the first URL (or turning forwarding on) creates the endpoint's signing
        secret; read it with `GET /api/endpoints/{slug}/forwarding`. Send `forwardUrl: null` (or `""`)
        to remove the URL, which fails while forwarding is on. Turning forwarding off marks
        deliveries that are still waiting as failed. See [Email forwarding](https://webhooks.cc/docs/forwarding).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
      responses:
        "200":
          description: Updated endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A team member sent an owner-only field (email, notification, signing, or forwarding settings),
            or the API key belongs to an unclaimed agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            Secrets cannot be encrypted on this server, so a signing secret or the first forwarding
            URL cannot be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteEndpoint
      tags: [Endpoints]
      summary: Delete endpoint
      description: Deletes the endpoint and all its captured requests. Only the owner can delete.
      responses:
        "204":
          description: Endpoint deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/favorite:
    parameters:
      - $ref: "#/components/parameters/slug"

    put:
      operationId: favoriteEndpoint
      tags: [Endpoints]
      summary: Favourite endpoint
      description: |
        Mark the endpoint as one of the caller's favourites, which the dashboard lists first and
        opens by default. Idempotent. Anyone who can open the endpoint may, team members included;
        a favourite is the caller's own. Rate limited to 60 changes a minute.
      responses:
        "200":
          $ref: "#/components/responses/FavoriteResult"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "403":
          description: Claimed account required (an unowned agent key is rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

    delete:
      operationId: unfavoriteEndpoint
      tags: [Endpoints]
      summary: Unfavourite endpoint
      description: Remove the endpoint from the caller's favourites. Idempotent.
      responses:
        "200":
          $ref: "#/components/responses/FavoriteResult"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "403":
          description: Claimed account required (an unowned agent key is rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/claim:
    post:
      operationId: claimEndpoint
      tags: [Endpoints]
      summary: Claim guest endpoint
      description: Claim an ephemeral guest endpoint, associating it with your account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  description: Slug of the guest endpoint to claim
      responses:
        "200":
          description: Claimed endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Requests ----------------------------------------------------------------

  /api/endpoints/{slug}/requests:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: listRequests
      tags: [Requests]
      summary: List requests
      description: List captured requests for an endpoint, newest first.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Maximum number of requests to return
        - name: since
          in: query
          schema:
            type: integer
          description: Only return requests received after this Unix timestamp (ms)
        - name: kind
          in: query
          schema:
            type: string
            enum: [http, email]
          description: Only HTTP requests (`http`) or only captured emails (`email`)
        - $ref: "#/components/parameters/extracts"
      responses:
        "200":
          description: Array of captured requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: clearRequests
      tags: [Requests]
      summary: Clear requests
      description: |
        Delete captured requests for an endpoint without deleting the endpoint itself.
        Optionally pass `before` to only delete requests older than a timestamp.
      parameters:
        - name: before
          in: query
          schema:
            type: integer
          description: Only delete requests received before this Unix timestamp (ms)
      responses:
        "204":
          description: Requests cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/requests/paginated:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: listRequestsPaginated
      tags: [Requests]
      summary: List requests (paginated)
      description: |
        Cursor-based paginated listing of captured requests, newest first. Pass the
        returned `cursor` to fetch the next page. The cursor marks the last request on
        the page, so requests arriving or deleted while paging never skip or repeat one.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Maximum number of requests per page
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from a previous page
        - name: kind
          in: query
          schema:
            type: string
            enum: [http, email]
          description: Only HTTP requests (`http`) or only captured emails (`email`); send the same value for every page
        - $ref: "#/components/parameters/extracts"
      responses:
        "200":
          description: Paginated request listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRequests"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Request ID

    get:
      operationId: getRequest
      tags: [Requests]
      summary: Get request
      description: |
        Get a single captured request by ID. Captured emails are requests too: they have
        `kind: "email"` and the parsed message in `email`.
      parameters:
        - $ref: "#/components/parameters/extracts"
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/requests/{id}/raw:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRawEmail
      tags: [Requests]
      summary: Download a captured email's exact message
      description: |
        The original message as `message/rfc822`, whatever its size when it was kept in
        object storage (`email.stored`); otherwise the database copy, which exists for
        messages up to 1 MiB.
      responses:
        "200":
          description: The message
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{id}/attachments/{index}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 99
        description: The attachment's position in `email.attachments`
    get:
      operationId: getAttachment
      tags: [Requests]
      summary: Download an attachment of a stored email
      responses:
        "200":
          description: The attachment, as a download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{id}/render:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Request ID of a captured email
    post:
      operationId: renderEmail
      tags: [Requests]
      summary: Render a captured email in a mail provider's shape
      description: |
        A captured email the way an inbound mail service posts it, to send to the handler you
        wrote for that service: the method, headers and body. `json` is webhooks.cc's own
        `email.received` JSON, unsigned, with attachment links, the same payload a JSON
        destination receives. Anyone who can read the email may render it. Rate limited to 120
        requests per minute per account. Sent with `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [json, postmark, sendgrid, mailgun, cloudmailin]
                mailgunSigningKey:
                  type: ["string", "null"]
                  maxLength: 200
                  description: Signs a `mailgun` form the way Mailgun does
            example:
              format: postmark
      responses:
        "200":
          description: The request to send to your handler
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [format, method, headers, body]
                properties:
                  format:
                    type: string
                    enum: [json, postmark, sendgrid, mailgun, cloudmailin]
                  method:
                    type: string
                    const: POST
                  headers:
                    type: object
                    required: [content-type, user-agent]
                    properties:
                      content-type:
                        type: string
                        description: For `sendgrid`, a multipart form whose boundary is named here
                      user-agent:
                        type: string
                  body:
                    type: string
                    description: The body as text (JSON, a URL-encoded form or a multipart form)
        "400":
          description: An unknown format, or the request is not an email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/attachments/{id}/{index}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Request ID of the captured email
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 99
        description: The attachment's position in `email.attachments`
    get:
      operationId: followAttachmentLink
      tags: [Requests]
      summary: Follow a signed attachment link
      description: |
        The attachment links that forwarded deliveries and rendered emails carry (a destination
        whose `attachments` is `links`). The signature in the query string is the permission, so
        no `Authorization` header is needed; build these links from a delivery, not by hand.
        Answers with a redirect to a short-lived download. The link ends when the email is
        deleted or passes its retention.
      security: []
      parameters:
        - name: e
          in: query
          required: true
          schema:
            type: string
          description: When the link expires, as the link carries it
        - name: s
          in: query
          required: true
          schema:
            type: string
          description: The link's signature
      responses:
        "302":
          description: Redirect to the download, valid for a few minutes
          headers:
            Location:
              schema:
                type: string
                format: uri
        "403":
          description: The link's signature is wrong or it has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/requests/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replayRequest
      tags: [Forwarding]
      summary: Send a request through its endpoint's destinations again
      description: |
        Queues the request to every destination that takes its kind, with their current settings.
        On an endpoint with layouts, an email is parsed again with the current layouts first.
        Owner only: anyone else gets `404`. Rate limited to 60 requests per minute.
      responses:
        "200":
          description: Whether a delivery was queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: boolean
                    description: False when no destination takes the request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/endpoints/{slug}/replay:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replayEndpoint
      tags: [Forwarding]
      summary: Send requests in a time range through the destinations again
      description: |
        Sends the requests received between `since` and `until` through the destinations again,
        with their current settings: at most 500, oldest first. Owner only: anyone else gets
        `404`. Rate limited to 10 requests per minute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                since:
                  type: integer
                  description: Milliseconds; requests received at or after this
                until:
                  type: integer
                  description: Milliseconds; requests received at or before this
                kind:
                  type: string
                  enum: [http, email]
      responses:
        "200":
          description: How many requests were found and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: integer
                  queued:
                    type: integer
                  limit:
                    type: integer
                    description: The most one call replays (500)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/endpoints/{slug}/layouts/preview:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: previewLayouts
      tags: [Endpoints]
      summary: Try layouts on a captured email
      description: |
        Which layout a captured email matches, with its fields and line items, using `layouts`
        (the saved ones when left out). Nothing is saved and no pages are used: attachments show
        an earlier parse, never a new one. Owner only: anyone else gets `404`. Rate limited to 20
        requests per minute per account.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  description: "A captured email on the endpoint (default: the newest)"
                layouts:
                  type: array
                  items:
                    $ref: "#/components/schemas/Layout"
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items:
                      type: string
                  layoutsCap:
                    type: integer
                  request:
                    type: ["object", "null"]
                    properties:
                      id:
                        type: string
                      subject:
                        type: ["string", "null"]
                      receivedAt:
                        type: integer
                  parsed:
                    oneOf:
                      - $ref: "#/components/schemas/ParsedEmail"
                      - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/integrations/google/start:
    post:
      operationId: connectGoogle
      tags: [Forwarding]
      summary: Ask to connect a Google account
      description: >-
        With an API key or agent token, answers 202 with an approval: approving sends the owner's
        browser to Google's consent page, and the approval's result is `{ connectionId, email }`.
        A browser session gets Google's consent URL directly.
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/integrations/google/pick:
    post:
      operationId: pickSpreadsheet
      tags: [Forwarding]
      summary: Ask the owner to choose a spreadsheet from Drive
      description: >-
        With an API key or agent token, answers 202 with an approval whose page opens Google's
        Drive picker for the connection's account. The result is `{ connectionId, spreadsheetId,
        url, tabs }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId]
              properties:
                connectionId:
                  type: string
                  format: uuid
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/integrations/google/spreadsheets:
    get:
      operationId: listSheetTabs
      tags: [Forwarding]
      summary: List a spreadsheet's tabs
      parameters:
        - name: connectionId
          in: query
          required: true
          schema:
            type: string
        - name: spreadsheetId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The tabs
          content:
            application/json:
              schema:
                type: object
                properties:
                  tabs:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSpreadsheet
      tags: [Forwarding]
      summary: Create a spreadsheet, or write an existing one's header row
      description: >-
        Creates a spreadsheet with the header row in the connection's account (201 `{ id, url }`).
        With `spreadsheetId` instead of a title it writes the header row of a spreadsheet the
        account reaches (`{ id, headerWritten }`); with an API key only when row 1 is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, headers]
              properties:
                connectionId:
                  type: string
                title:
                  type: string
                spreadsheetId:
                  type: string
                sheet:
                  type: string
                  default: Sheet1
                headers:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The header row of an existing spreadsheet
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/integrations/google/connections/{id}:
    delete:
      operationId: disconnectGoogle
      tags: [Forwarding]
      summary: Disconnect a Google account
      description: Revokes its access at Google; Sheets destinations using it fail until another is chosen.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/endpoints/{slug}/layouts/assist:
    parameters:
      - $ref: "#/components/parameters/slug"
    get:
      operationId: aiSetupStatus
      tags: [Endpoints]
      summary: AI setup status
      description: Whether AI setup is offered, and the assists allowed and used in a rolling 30 days.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                properties:
                  offered:
                    type: boolean
                  allowed:
                    type: integer
                  used:
                    type: integer
                  nextAt:
                    type: [string, "null"]
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: aiSetup
      tags: [Endpoints]
      summary: Ask for AI setup
      description: >-
        Proposes email fields, a layout, or a repaired field from 1 to 5 of the endpoint's emails.
        The emails go to Anthropic's model, so with an API key or agent token this answers 202 with
        an approval whose page lists them, and it runs when the owner approves; a browser session
        sends `consent: true`. The result is `{ fields: [{ field, values }], match, layoutName,
        dropped, allowed, used }`. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ask, requestIds]
              properties:
                ask:
                  type: object
                  description: >-
                    `{ kind: "field", name, description }`, `{ kind: "layout", description? }` or
                    `{ kind: "repair", field }`
                  additionalProperties: true
                requestIds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    format: uuid
                consent:
                  type: boolean
                  description: A browser session's consent; ignored for an API key
      responses:
        "200":
          description: The proposals (a browser session)
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/endpoints/{slug}/layouts/template:
    parameters:
      - $ref: "#/components/parameters/slug"
    get:
      operationId: listLayoutTemplates
      tags: [Endpoints]
      summary: List the ready-made layouts
      description: The ready-made layouts there are to add, the same for every endpoint, with the fields each reads.
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      required: [id, sender, kind, description, fields, lineItems]
                      properties:
                        id:
                          type: string
                          description: What POST takes as `template`
                        sender:
                          type: string
                        kind:
                          type: string
                          description: What kind of email it reads, such as "order notifications"
                        description:
                          type: string
                        fields:
                          type: array
                          items:
                            type: string
                          description: The names of the fields it picks out
                        lineItems:
                          type: boolean
                          description: Whether it also reads line items
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addLayoutTemplate
      tags: [Endpoints]
      summary: Add a ready-made layout
      description: |
        Adds one of the ready-made layouts (the sender pages at https://mailhooks.cc/parse) to the
        end of the endpoint's layouts, under an id of its own when the template's id is taken
        (`shopify-orders-2`). The templates are `shopify-orders`, `woocommerce-orders`,
        `etsy-sales`, `amazon-seller-orders`, `ebay-sales`, `stripe-receipts`, `paypal-payments`,
        `booking-com-reservations`, `airbnb-reservations`, `calendly-bookings`, `form-responses`,
        `csv-reports` and `pdf-invoices`. Owner only: anyone else gets `404`. Rate limited to 30
        requests per minute per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  description: A template's id
            example:
              template: shopify-orders
      responses:
        "201":
          description: The id the layout was added under
          content:
            application/json:
              schema:
                type: object
                required: [layoutId]
                properties:
                  layoutId:
                    type: string
        "400":
          description: Unknown template, or the endpoint already has 50 layouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The endpoint's layouts changed while this ran; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/email-fields/preview:
    parameters:
      - $ref: "#/components/parameters/slug"
    post:
      operationId: previewEmailFields
      tags: [Endpoints]
      summary: Try email fields on a captured email
      description: |
        What `emailFields` (the saved ones when left out) find in a captured email: `requestId`,
        or the endpoint's newest email. A field with a problem (a pattern RE2 cannot run) is
        listed in `problems` and left out of `values`. Nothing is saved. Owner only: anyone else
        gets `404`. Rate limited to 30 requests per minute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                  description: "A captured email on the endpoint (default: the newest)"
                emailFields:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/EmailField"
            example:
              emailFields:
                - name: invoice
                  from: subject
                  pattern: "(INV-\\d+)"
      responses:
        "200":
          description: The preview
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [problems, request, values]
                properties:
                  problems:
                    type: array
                    items:
                      type: string
                  request:
                    type: ["object", "null"]
                    description: The email the fields ran on; null when the endpoint has no email yet
                    properties:
                      id:
                        type: string
                      subject:
                        type: ["string", "null"]
                      receivedAt:
                        type: integer
                  values:
                    type: ["object", "null"]
                    description: Each field's value by name (null when its pattern found nothing); null without an email
                    additionalProperties:
                      type: ["string", "null"]
              example:
                problems: []
                request:
                  id: 0b7e6c1a-58a4-4d0e-9a53-6f3f0f1f7a11
                  subject: "Invoice INV-2041 from Acme"
                  receivedAt: 1791538201882
                values:
                  invoice: INV-2041
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/responses/preview:
    parameters:
      - $ref: "#/components/parameters/slug"
    post:
      operationId: previewResponse
      tags: [Endpoints]
      summary: Preview what a sender would get back
      description: |
        Runs the endpoint's response rules against a captured request (`requestId`; by default the
        newest HTTP request, or a sample when there is none) and fills in the placeholders,
        without sending anything. `mockResponse` and `responseRules` in the body try unsaved
        settings; left out, the saved ones apply. Anyone who can change the endpoint's responses
        can preview them, team members on a shared endpoint included. Rate limited to 120 requests
        per minute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                mockResponse:
                  oneOf:
                    - $ref: "#/components/schemas/MockResponse"
                    - type: "null"
                responseRules:
                  oneOf:
                    - type: array
                      items:
                        $ref: "#/components/schemas/ResponseRule"
                      maxItems: 50
                    - type: "null"
      responses:
        "200":
          description: The rule that matches and the response it sends
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePreview"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The body is larger than 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/alerts:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAlerts
      tags: [Endpoints]
      summary: Alert settings and recent alerts
      description: |
        The endpoint's alert settings and its latest alerts (up to 50), open ones first. An alert
        opens when emails keep missing a field, when no email arrived for a set number of hours,
        or when a delivery failed after every retry. Owner only: anyone else gets `404`. See
        https://webhooks.cc/docs/forwarding#alerts.
      responses:
        "200":
          description: Settings and alerts, open ones first
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AlertSettings"
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          enum: [fields, silence, destination]
                        subject:
                          type: [string, "null"]
                        openedAt:
                          type: integer
                        resolvedAt:
                          type: [integer, "null"]
                        details:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAlerts
      tags: [Endpoints]
      summary: Change alert settings
      description: |
        Changes the settings sent and leaves the rest. Owner only: anyone else gets `404`. Rate
        limited to 60 requests per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettings"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AlertSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Forwarding --------------------------------------------------------------

  /api/endpoints/{slug}/destinations:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: listDestinations
      tags: [Forwarding]
      summary: List destinations
      description: |
        The endpoint's destinations in order, with header values masked. Owner only: anyone else
        gets `404`.
      parameters:
        - name: summary
          in: query
          schema:
            type: string
            enum: ["true"]
          description: |
            `true` adds `summary` to each destination: its deliveries of the last 24 hours and
            what is waiting now.
      responses:
        "200":
          description: The destinations, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createDestination
      tags: [Forwarding]
      summary: Add a destination
      description: |
        Adds a destination (an endpoint has at most 10) and creates its signing secret. `url` is
        required, except for a file drop, which needs `config` and `dropSecret` instead. Owner
        only: anyone else gets `404`. Rate limited to 60 requests per minute per account, shared
        with changing a destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
            example:
              url: https://example.com/hooks/orders
              name: Orders
              http: true
              email: false
              format: template
              bodyTemplate:
                event: "{{ json.type }}"
              filter:
                logic: and
                conditions:
                  - field: body_path
                    op: eq
                    path: type
                    value: invoice.paid
      responses:
        "201":
          description: The new destination
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          description: A field is wrong; `error` names it (a URL that is not allowed, an unknown placeholder, a condition RE2 cannot run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The endpoint already has 10 destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is larger than 128 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/slug"
      - $ref: "#/components/parameters/destinationId"

    get:
      operationId: getDestination
      tags: [Forwarding]
      summary: Get a destination
      description: "Owner only: anyone else gets `404`."
      responses:
        "200":
          description: The destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateDestination
      tags: [Forwarding]
      summary: Change a destination
      description: |
        Changes the fields sent and leaves the rest. Switching a destination off, or taking a kind
        away from it, marks the deliveries waiting for it as failed. A file drop asks for
        `dropSecret` again whenever its server, login, bucket, pinned host key or certificate
        fingerprint changes. Owner only: anyone else gets `404`. Rate limited to 60 requests per
        minute per account, shared with adding a destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "200":
          description: The destination as it is now
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

    delete:
      operationId: deleteDestination
      tags: [Forwarding]
      summary: Remove a destination
      description: |
        Deliveries still waiting for it are marked failed; its delivery log stays. Owner only:
        anyone else gets `404`.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/destinations/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/slug"
      - $ref: "#/components/parameters/destinationId"

    get:
      operationId: getDestinationSecret
      tags: [Forwarding]
      summary: Get a destination's signing secret
      description: |
        The secret that signs this destination's deliveries, for checking the `webhook-signature`
        header (signed JSON and templates) or the `webhooks-cc-signature` header (requests relayed
        as received) in your handler. Owner only: anyone else gets `404`. Sent with
        `Cache-Control: no-store`.
      responses:
        "200":
          description: The signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardingSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: rotateDestinationSecret
      tags: [Forwarding]
      summary: Rotate a destination's signing secret
      description: |
        Replaces the secret and returns the new one. Every delivery from now on, retries included,
        is signed with it. Owner only: anyone else gets `404`.
      responses:
        "200":
          description: The new signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardingSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/slug"
      - $ref: "#/components/parameters/destinationId"

    post:
      operationId: testDestination
      tags: [Forwarding]
      summary: Send one delivery to a destination now
      description: |
        Sends one delivery exactly as a real one would go out and reports what came back: the
        request named by `requestId`, or the endpoint's newest request of `kind` (by default the
        kind the destination takes), or a sample when there is none. The filter is reported
        (`filterPasses`), not applied, so a test always sends. Nothing is queued, retried or added
        to the delivery log. A file drop's test logs in and writes `webhooks-cc-test.txt` to the
        folder; a Google Sheets destination cannot be tested this way (`400`). Owner only: anyone
        else gets `404`. Rate limited to 10 requests per minute, shared with the forwarding test.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [http, email]
                requestId:
                  type: string
                  format: uuid
                  description: A captured request on this endpoint
      responses:
        "200":
          description: |
            What the destination answered. A non-2xx answer is still a `200` here, with
            `delivered: false`.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardTestResult"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/destinations/order:
    parameters:
      - $ref: "#/components/parameters/slug"

    put:
      operationId: reorderDestinations
      tags: [Forwarding]
      summary: Reorder destinations
      description: |
        Puts the destinations in the order given: how the dashboard lists them and the order
        captures are queued in. Owner only: anyone else gets `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Destination ids of this endpoint, in the new order
      responses:
        "200":
          description: The destinations in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/destinations/preview:
    parameters:
      - $ref: "#/components/parameters/slug"

    post:
      operationId: previewDestination
      tags: [Forwarding]
      summary: Dry run of a destination
      description: |
        What a destination would send for a captured request, without sending anything.
        `destinationId` starts from a saved destination; `destination` holds unsaved fields, on
        top of the saved ones or on their own (then with a `url`). `requestId` picks the request;
        by default it is the newest of a kind the destination takes, or a sample. Header values
        stored on the destination stay masked. Owner only: anyone else gets `404`. Rate limited to
        120 requests per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationId:
                  type: string
                  format: uuid
                destination:
                  $ref: "#/components/schemas/DestinationInput"
                requestId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The request it would send
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPreview"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/forwarding:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: getForwardingSecret
      tags: [Forwarding]
      summary: Get the primary destination's signing secret
      description: |
        The legacy single-URL API, which still works: the endpoint's `forward*` fields stand for
        its primary destination, and this returns that destination's signing secret. The secret is
        created when the endpoint's first forwarding URL is saved. New code can use
        `/api/endpoints/{slug}/destinations/{id}/secret`. Owner only: anyone else gets `404`. The
        response is sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: The forwarding secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardingSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Endpoint not found, not owned by you, or it has no forwarding secret yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: rotateForwardingSecret
      tags: [Forwarding]
      summary: Rotate the primary destination's signing secret
      description: |
        Replaces the primary destination's signing secret with a new one and returns it. Every
        delivery sent from now on is signed with the new secret, including retries of deliveries
        still waiting, so update your handler right away. Owner only: anyone else gets `404`. The
        response is sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: The new forwarding secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardingSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/forwarding/test:
    parameters:
      - $ref: "#/components/parameters/slug"

    post:
      operationId: testForwarding
      tags: [Forwarding]
      summary: Send a test delivery to the primary destination
      description: |
        Sends the endpoint's newest captured request of the chosen kind to the primary destination
        (the saved forwarding URL) once, exactly as a delivery would go out, and returns what your
        server answered. When the endpoint has no request of that kind yet, a sample marked as a
        test is sent instead. Works whether forwarding is on or off. Nothing is queued, retried,
        or added to the delivery log. Each destination has a test of its own at
        `/api/endpoints/{slug}/destinations/{id}/test`. Owner only: anyone else gets `404`. Rate
        limited to 10 requests per minute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [http, email]
                  description: "Default: `http` when the destination takes HTTP requests, otherwise `email`"
      responses:
        "200":
          description: |
            What the forwarding URL answered. A non-2xx answer is still a `200` here, with
            `delivered: false`.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardTestResult"
        "400":
          description: No forwarding URL saved yet, or the delivery could not be built
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Endpoint not found or not owned by you
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/endpoints/{slug}/deliveries:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: listEndpointDeliveries
      tags: [Forwarding]
      summary: List deliveries
      description: |
        The endpoint's delivery log, newest first, for HTTP requests and emails alike. Owner only:
        anyone else gets `404`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
          description: Number of deliveries to return
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, failed, skipped]
            default: all
          description: "`pending` is queued or retrying; `skipped` is turned down by the destination's filter"
        - name: destination
          in: query
          schema:
            type: string
            format: uuid
          description: Only this destination's deliveries
        - name: before
          in: query
          schema:
            type: string
          description: The `cursor` of the last row you have, for the rows after it (opaque; URL-encode it)
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/deliveries/summary:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: getDeliverySummary
      tags: [Forwarding]
      summary: Delivery counts
      description: |
        What was delivered and what failed among the deliveries queued in the last 24 hours, what
        is waiting now, and the failed and total counts among the deliveries still kept. Each
        count stops at 100,000. Owner only: anyone else gets `404`.
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                type: object
                required: [last24h, pending, failed, total]
                properties:
                  last24h:
                    type: object
                    required: [delivered, failed]
                    properties:
                      delivered:
                        type: integer
                      failed:
                        type: integer
                  pending:
                    type: integer
                  failed:
                    type: integer
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/endpoints/{slug}/deliveries/redeliver-failed:
    parameters:
      - $ref: "#/components/parameters/slug"

    post:
      operationId: redeliverFailed
      tags: [Forwarding]
      summary: Redeliver everything that failed
      description: |
        Queues every request whose latest delivery to a destination failed again, oldest first,
        with that destination's current settings. At most 1,000 deliveries wait for a destination
        at a time, so `queued` can be lower than the failed count; call it again once those are
        through. Owner only: anyone else gets `404`. Rate limited to 10 requests per minute.
      parameters:
        - name: destination
          in: query
          schema:
            type: string
            format: uuid
          description: Only this destination's failed deliveries
      responses:
        "200":
          description: How many deliveries were queued
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No destination is switched on (or the one named is off)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/requests/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Request ID of a captured HTTP request or email

    get:
      operationId: listRequestDeliveries
      tags: [Forwarding]
      summary: List deliveries of a request
      description: |
        Every forwarded copy of one request, newest first (up to 20), each with its attempts.
        Anyone who can read the request can list them, including team members on a shared
        endpoint, who see only the host of where it went (`target`, `destination.url`). A request
        that was never forwarded returns an empty array.
      responses:
        "200":
          description: Deliveries of the request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: redeliverRequest
      tags: [Forwarding]
      summary: Redeliver a request
      description: |
        Queues another delivery of an HTTP request or an email: to every destination that is on
        and takes its kind, or only to `destinationId`, whatever that destination's filter says.
        It is sent with the destinations' current settings and retried on the usual schedule, and
        it also sends a request that was never forwarded. Owner only: anyone else gets `404`. Rate
        limited to 30 requests per minute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationId:
                  type: ["string", "null"]
                  format: uuid
                  description: Send it to this destination only
      responses:
        "200":
          description: Delivery queued
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: ID of the new delivery (the first, when several destinations take it)
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, the endpoint is not yours, or the destination is not on this endpoint
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            No destination that is on takes this kind of request, or the email is still being
            parsed by the endpoint's layouts (its deliveries go when that is done)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/integrations/google/connections:
    get:
      operationId: listGoogleConnections
      tags: [Forwarding]
      summary: List connected Google accounts
      description: |
        The Google accounts connected for Google Sheets destinations; a Sheets destination's
        `config.connectionId` is one of these ids. Connecting one, or choosing an existing
        spreadsheet, is an approval the owner finishes at Google; disconnecting works with any key.
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: object
                required: [available, connections]
                properties:
                  available:
                    type: boolean
                    description: Whether Google Sheets is set up on this server
                  connections:
                    type: array
                    items:
                      type: object
                      required: [id, email, createdAt]
                      properties:
                        id:
                          type: string
                        email:
                          type: ["string", "null"]
                        createdAt:
                          type: integer
                          description: Unix timestamp (ms)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Streaming ---------------------------------------------------------------

  /api/stream/{slug}:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: streamRequests
      tags: [Streaming]
      summary: Stream requests (SSE)
      description: |
        Server-Sent Events stream of incoming webhook requests. Each captured request
        arrives as an `event: request` message with JSON data.

        The server sends keepalive pings (`:ping`) every 30 seconds. Maximum connection
        duration is 30 minutes; reconnect when the stream closes.

        Captured emails arrive as `request` events too, with `kind: "email"`, `method: "EMAIL"` and
        the recipient address as `path`. Stream messages do not carry the parsed `email`; fetch the
        request by its `_id` for it.

        **Event types:**
        - `connected`: stream established
        - `request`: captured webhook or email (JSON data matching the StreamRequest schema,
          which differs from Request: `_id` instead of `id`, an extra `_creationTime`, and no
          `email`)
        - `keepalive`: connection keepalive
        - `timeout`: max duration reached, reconnect
        - `endpoint_deleted`: endpoint was deleted, stream closed
      parameters:
        - name: since
          in: query
          schema:
            type: integer
          description: Resume from this Unix timestamp (ms); returns requests received after this time
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Search ------------------------------------------------------------------

  /api/search/requests:
    get:
      operationId: searchRequests
      tags: [Search]
      summary: Search requests
      description: |
        Search retained requests across endpoints you own and endpoints shared
        with you through a subscribed team. Rows on shared endpoints are bounded
        by the owner's retention, not the caller's plan.

        A search reads requests newest first (oldest first with `order=asc`)
        for a limited time, and stops at a full page, the end of the range, or
        that time limit, whichever comes first. With `paged=true` the limit is
        about 2 seconds a call, and the caller reads on with the cursor; use
        that in new integrations. Without it a call reads for about 10
        seconds, so a client that reads one answer still reaches older
        matches. The body is the matches found so far; the `X-Search-*`
        headers say whether that was everything and where the search stopped.
        While `X-Search-Complete` is `false`, repeat the call with `cursor`
        set to `X-Search-Cursor` (and the other parameters unchanged) to read
        on. An empty page that is not complete means nothing was found yet,
        not that nothing matches.

        Rate limited to 60 requests per 10 minutes; calls with a `cursor`
        count against their own limit of 300 per 10 minutes instead. An
        account runs at most 2 searches at once and the service limits how
        many run in all, so a call can answer 429 `search_busy` even when the
        account runs none: wait for `Retry-After` seconds and send it again.
      parameters:
        - name: slug
          in: query
          schema:
            type: string
          description: Filter by endpoint slug
        - name: method
          in: query
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, EMAIL]
          description: Filter by HTTP method (`EMAIL` for captured emails)
        - name: kind
          in: query
          schema:
            type: string
            enum: [http, email]
          description: Only HTTP requests or only captured emails
        - name: q
          in: query
          schema:
            type: string
            maxLength: 1000
          description: |
            Text to find, as a case-insensitive substring of the path, the
            headers or the body. Every character is literal (`%`, `_` and `\`
            are not wildcards). Emails also match their decoded subject, text
            and from, to and cc addresses. A request id finds that request
            first.
        - name: from
          in: query
          schema:
            type: string
          description: |
            Start time: a Unix timestamp in milliseconds (any number from
            zero up; a fraction is rounded down), or a duration back from now
            (`500ms`, `90s`, `15m`, `1h`, `1.5h`, `7d`). Empty means no bound.
          examples:
            timestamp:
              value: "1791450602000"
            duration:
              value: 1h
        - name: to
          in: query
          schema:
            type: string
          description: |
            End time: a Unix timestamp in milliseconds (any number from
            zero up; a fraction is rounded down), or a duration back from now
            (`500ms`, `90s`, `15m`, `1h`, `1.5h`, `7d`). Empty means no bound.
          examples:
            timestamp:
              value: "1791450602000"
            duration:
              value: 1h
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum number of results in a page
        - name: paged
          in: query
          schema:
            type: boolean
            default: false
          description: |
            Send `true` (or `1`) when you page with the cursor: each call then
            reads for about 2 seconds at most. Without it a call reads for
            about 10 seconds before answering.
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Continue from where an earlier call stopped: the `X-Search-Cursor`
            header (or the count's `cursor`) it returned. Opaque, and only
            valid for the `order` it was made for.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            maximum: 10000
          description: Skip this many matches. Prefer `cursor` to page.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order by receivedAt
      responses:
        "200":
          description: The matches found, which may be a partial page (see the `X-Search-*` headers)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-Search-Complete:
              $ref: "#/components/headers/X-Search-Complete"
            X-Search-Searched-Until:
              $ref: "#/components/headers/X-Search-Searched-Until"
            X-Search-Cursor:
              $ref: "#/components/headers/X-Search-Cursor"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: |
            Validation error: `invalid_from`, `invalid_to`, `invalid_kind`,
            `invalid_q` (longer than 1,000 characters), `invalid_limit`,
            `invalid_offset`, `invalid_cursor` (not a cursor this API returned, or one
            made for the other order).
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "403":
          description: Claimed account required (an unowned agent key is rejected)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Rate limit exceeded, or `search_busy`: too many searches are
            running (an account runs 2 at once, and the service limits how
            many run in all). Retry after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                searchBusy:
                  value:
                    error: search_busy
                    message: Too many searches are running; try again shortly.
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/search/requests/count:
    get:
      operationId: searchRequestsCount
      tags: [Search]
      summary: Count search results
      description: |
        Count retained requests matching search filters without returning them.
        Covers endpoints shared with you through a subscribed team.
        Accepts the same query parameters as search (except `limit`, `offset`, `order`).

        A count without `q` and without `method` is always exact, for one
        endpoint or for all of them. A count with `q` or `method` reads
        requests like a search does, for a limited time (about 2 seconds with
        `paged=true`, about 10 without): `exact` says whether it read the
        whole range, and when it is `false`, `count` is a lower bound. Call
        again with `cursor` to count the next stretch; each call counts only
        what it read, so the counts add up.

        Rate limited to 120 requests per 10 minutes; calls with a `cursor`
        count against their own limit of 300 per 10 minutes instead. An
        account runs at most 2 searches and counts at once and the service
        limits how many run in all, so a call can answer 429 `search_busy`
        even when the account runs none: wait for `Retry-After` seconds and
        send it again.
      parameters:
        - name: slug
          in: query
          schema:
            type: string
          description: Filter by endpoint slug
        - name: method
          in: query
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, EMAIL]
          description: Filter by HTTP method (`EMAIL` for captured emails)
        - name: kind
          in: query
          schema:
            type: string
            enum: [http, email]
          description: Only HTTP requests or only captured emails
        - name: q
          in: query
          schema:
            type: string
            maxLength: 1000
          description: |
            Text to find, as a case-insensitive substring of the path, the
            headers or the body. Every character is literal (`%`, `_` and `\`
            are not wildcards). Emails also match their decoded subject, text
            and from, to and cc addresses. A request id finds that request
            first.
        - name: from
          in: query
          schema:
            type: string
          description: |
            Start time: a Unix timestamp in milliseconds (any number from
            zero up; a fraction is rounded down), or a duration back from now
            (`500ms`, `90s`, `15m`, `1h`, `1.5h`, `7d`). Empty means no bound.
          examples:
            timestamp:
              value: "1791450602000"
            duration:
              value: 1h
        - name: to
          in: query
          schema:
            type: string
          description: |
            End time: a Unix timestamp in milliseconds (any number from
            zero up; a fraction is rounded down), or a duration back from now
            (`500ms`, `90s`, `15m`, `1h`, `1.5h`, `7d`). Empty means no bound.
          examples:
            timestamp:
              value: "1791450602000"
            duration:
              value: 1h
        - name: paged
          in: query
          schema:
            type: boolean
            default: false
          description: |
            Send `true` (or `1`) when you page with the cursor: each call then
            reads for about 2 seconds at most. Without it a call reads for
            about 10 seconds before answering.
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Continue from where an earlier call stopped: the `X-Search-Cursor`
            header (or the count's `cursor`) it returned. Opaque, and only
            valid for the `order` it was made for.
      responses:
        "200":
          description: Match count
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-Search-Complete:
              $ref: "#/components/headers/X-Search-Complete"
            X-Search-Searched-Until:
              $ref: "#/components/headers/X-Search-Searched-Until"
            X-Search-Cursor:
              $ref: "#/components/headers/X-Search-Cursor"
          content:
            application/json:
              schema:
                type: object
                required: [count, exact, searchedUntil, cursor]
                properties:
                  count:
                    type: integer
                    description: Matches found in the part that was read
                  exact:
                    type: boolean
                    description: |
                      True when the whole range was read. False when the time
                      limit came first: `count` is then a lower bound.
                  searchedUntil:
                    type: [integer, "null"]
                    description: How far the count read, as a Unix timestamp (ms)
                  cursor:
                    type: [string, "null"]
                    description: Send as `cursor` to count on from there; null when the count is exact
              examples:
                exact:
                  value:
                    count: 42
                    exact: true
                    searchedUntil: null
                    cursor: null
        "400":
          description: |
            Validation error: `invalid_from`, `invalid_to`, `invalid_kind`,
            `invalid_q` (longer than 1,000 characters), `invalid_cursor` (not a cursor this API returned, or one
            made for the other order).
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "403":
          description: Claimed account required (an unowned agent key is rejected)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Rate limit exceeded, or `search_busy`: too many searches are
            running (an account runs 2 at once, and the service limits how
            many run in all). Retry after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                searchBusy:
                  value:
                    error: search_busy
                    message: Too many searches are running; try again shortly.
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  # -- Send --------------------------------------------------------------------

  /api/send-test:
    post:
      operationId: sendTestWebhook
      tags: [Send]
      summary: Send test webhook
      description: |
        Send a test webhook to one of your endpoints. The webhook is sent to the receiver
        and captured like any external webhook. Rate limited to 30 requests per minute.
        Maximum body size: 1MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  description: Target endpoint slug
                method:
                  type: string
                  default: POST
                  description: HTTP method
                path:
                  type: string
                  description: Optional sub-path appended to the endpoint URL
                headers:
                  type: object
                  additionalProperties:
                    type: string
                  description: HTTP headers to include
                body:
                  type: string
                  description: Request body
      responses:
        "200":
          description: Webhook sent
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code returned by the receiver
                  statusText:
                    type: string
                    description: Status text returned by the receiver
                  body:
                    type: string
                    description: Response body from the receiver
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "502":
          description: Upstream receiver unreachable
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/send-test-email:
    post:
      operationId: sendTestEmail
      tags: [Send]
      summary: Send test email
      description: |
        Deliver a sample email (with a one-time code and a link) to one of your endpoints, or one
        shared with you through a team. It is captured and counted like any other email, but it does
        not travel over SMTP, so no sender checks (SPF, DKIM, DMARC) run on it.
        Pass `tag` to send it to a tagged address. Rate limited to 10 requests per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,50}$"
                  description: Target endpoint slug
                tag:
                  type: string
                  description: |
                    Deliver to `{slug}+{tag}@mailhooks.cc` instead of the plain address, so a test
                    can wait for its own sample. Printable ASCII without spaces, quotes, brackets,
                    `@`, `,`, `;` or `:`; slug, `+` and tag together at most 64 characters.
      responses:
        "200":
          description: Test email captured
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [status, requestId]
                properties:
                  status:
                    type: string
                    enum: [captured]
                  requestId:
                    type: ["string", "null"]
                    description: ID of the captured email
        "400":
          description: Invalid JSON, slug or tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No endpoint with that slug that you own or that is shared with you. Guest endpoints
            answer `404` too: they belong to no account, and only endpoints on an account receive
            email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The endpoint's request quota is used up
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The endpoint has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The test email could not be delivered; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Test emails are not available on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -- Usage -------------------------------------------------------------------

  /api/usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: Get usage
      description: >-
        Returns the authenticated user's request quota and usage, and beside it parsed pages,
        preview data and AI assists, each with its own window.
      responses:
        "200":
          description: Usage information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/billing:
    get:
      operationId: getBilling
      tags: [Usage]
      summary: Get billing
      description: >-
        What the account pays for, read only: the plan and its subscription (status, interval,
        when it renews, a change waiting for the renewal, whether it cancels at the period's
        end), the add-ons (extra requests, parsed pages, domains), and every team the account
        belongs to with its subscription and add-ons. Works with an API key. Changing a plan,
        seats or add-ons takes a browser session.
      responses:
        "200":
          description: The billing summary
          content:
            application/json:
              schema:
                type: object
                required: [plan, subscription, quotaPeriod, addons, teams]
                properties:
                  plan:
                    type: string
                    enum: [free, pro, business]
                  subscription:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        nullable: true
                        enum: [active, canceled, past_due]
                      interval:
                        type: string
                        nullable: true
                        enum: [month, year]
                      renewsAt:
                        type: string
                        format: date-time
                        nullable: true
                      cancelAtPeriodEnd:
                        type: boolean
                      pendingChange:
                        type: object
                        nullable: true
                        properties:
                          plan:
                            type: string
                          interval:
                            type: string
                            nullable: true
                  quotaPeriod:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date-time
                        nullable: true
                      end:
                        type: string
                        format: date-time
                        nullable: true
                  addons:
                    type: object
                    description: The add-on state for requests, pages and domains.
                    additionalProperties: true
                  teams:
                    type: array
                    description: Every team, as the teams list returns it, with its add-ons.
                    items:
                      type: object
                      additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Teams -------------------------------------------------------------------

  /api/teams:
    get:
      operationId: listTeams
      tags: [Teams]
      summary: List teams
      description: List all teams the authenticated user owns or is a member of.
      responses:
        "200":
          description: Array of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTeam
      tags: [Teams]
      summary: Create team
      description: |
        Create a new team. Any account can create one; it is suspended until it has a Teams subscription.
        Rate limited to 10 requests per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Team display name
      responses:
        "200":
          description: Created team
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/teamId"

    patch:
      operationId: updateTeam
      tags: [Teams]
      summary: Update team
      description: Update the team name. Only the owner can update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteTeam
      tags: [Teams]
      summary: Delete team
      description: >-
        Delete a team. Only the owner can delete. All shares are removed and the team's
        subscription ends at once. Asked with an API key or agent token, it answers 202 with
        an approval; the team is deleted once the owner approves, and the poll carries
        `{ deleted, teamId }`.
      responses:
        "204":
          description: Team deleted
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/teamId"

    get:
      operationId: listTeamMembers
      tags: [Teams]
      summary: List team members
      description: List all members and pending invites for a team.
      responses:
        "200":
          description: Members and pending invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamMember"
                  pendingInvites:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: User ID to remove

    delete:
      operationId: removeTeamMember
      tags: [Teams]
      summary: Remove team member
      description: Remove a member from the team. Only the team owner can remove members.
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}/endpoints:
    parameters:
      - $ref: "#/components/parameters/teamId"

    get:
      operationId: listTeamEndpoints
      tags: [Teams]
      summary: List endpoints shared with a team
      description: |
        Every endpoint shared with the team, oldest share first. Any member may
        call it, also while the team has no subscription.
      responses:
        "200":
          description: Shared endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamSharedEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: shareEndpointWithTeam
      tags: [Teams]
      summary: Share endpoint with team
      description: |
        Share one of your endpoints with a team. Rate limited to 30 requests per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId]
              properties:
                endpointId:
                  type: string
                  description: ID of the endpoint to share
      responses:
        "200":
          description: Endpoint shared
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/teams/{teamId}/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: endpointId
        in: path
        required: true
        schema:
          type: string
        description: Endpoint ID to unshare

    delete:
      operationId: unshareEndpointFromTeam
      tags: [Teams]
      summary: Unshare endpoint from team
      description: Remove an endpoint from a team. The endpoint itself is not deleted.
      responses:
        "204":
          description: Endpoint unshared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}/invite:
    parameters:
      - $ref: "#/components/parameters/teamId"

    post:
      operationId: createTeamInvite
      tags: [Teams]
      summary: Invite to team
      description: |
        Send an invitation to join a team by email.
        Rate limited to 20 requests per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to invite
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "200":
          description: Invite sent
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvite"
        "400":
          $ref: "#/components/responses/BadRequestRateLimited"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/teams/{teamId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
        description: ID of the pending invite to revoke

    delete:
      operationId: revokeTeamInvite
      tags: [Teams]
      summary: Revoke a pending invite
      description: |
        Withdraw a pending invite. Only the team owner can revoke; accepted and
        declined invites cannot be revoked. Shares the invite rate limit of 20
        requests per 10 minutes.
      responses:
        "200":
          description: Invite revoked
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"

  /api/teams/{teamId}/leave:
    parameters:
      - $ref: "#/components/parameters/teamId"

    post:
      operationId: leaveTeam
      tags: [Teams]
      summary: Leave team
      description: Leave a team. Only non-owner members can leave. Owners must delete the team.
      responses:
        "200":
          description: Left team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Invites -----------------------------------------------------------------

  /api/invites:
    get:
      operationId: listInvites
      tags: [Invites]
      summary: List pending invites
      description: List all pending team invitations for the authenticated user.
      responses:
        "200":
          description: Array of pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/invites/{inviteId}/accept:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
        description: Invite ID to accept

    post:
      operationId: acceptInvite
      tags: [Invites]
      summary: Accept invite
      description: Accept a pending team invitation.
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/invites/{inviteId}/decline:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
        description: Invite ID to decline

    post:
      operationId: declineInvite
      tags: [Invites]
      summary: Decline invite
      description: Decline a pending team invitation.
      responses:
        "200":
          description: Invite declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Sharing -----------------------------------------------------------------

  /api/shares:
    get:
      operationId: listShares
      tags: [Sharing]
      summary: List previews and live tunnels
      description: |
        The account's `whk share` previews and `whk tunnel --live` sessions (live first, then the
        latest that ended), teammates' previews under its teams' names and teammates' live tunnels
        on its own endpoints, with this month's shared data, the plan's limits, where it stands on
        reserved names, and `hints`: next steps as `whk` commands. Rate limited to 120 requests a
        minute.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [live, ended]
          description: Only live, or only ended, runs
      responses:
        "200":
          description: Shares, usage, limits and hints
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelShareList"
        "400":
          description: "`state` is not `live` or `ended`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The token belongs to an unclaimed agent sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  /api/shares/{shareId}/stop:
    parameters:
      - $ref: "#/components/parameters/shareId"
    post:
      operationId: stopShare
      tags: [Sharing]
      summary: Stop a preview or live tunnel
      description: |
        Stops one of the account's runs, a teammate's preview under one of its teams' names, or a
        teammate's live tunnel on one of its own endpoints. The CLI running it is told why and
        exits. Rate limited to 60 requests a minute.
      responses:
        "200":
          description: Stopped
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [ok, stopped, edgeReached]
                properties:
                  ok:
                    type: boolean
                  stopped:
                    type: boolean
                    description: Whether a running share was ended (false when it had already ended)
                  edgeReached:
                    type: boolean
                    description: Whether the tunnel service closed it at once; otherwise it closes within 30 seconds
        "404":
          description: No such run for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  /api/shares/{shareId}/requests:
    parameters:
      - $ref: "#/components/parameters/shareId"
    get:
      operationId: listShareRequests
      tags: [Sharing]
      summary: A preview's visitor log
      description: |
        The last requests visitors made to a running preview, newest first, from the tunnel
        service's memory: no addresses, a number per visitor. Rate limited to 120 requests a minute.
      responses:
        "200":
          description: The visitor log
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelVisits"
        "404":
          description: No such run for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  /api/tunnel-names:
    get:
      operationId: listTunnelNames
      tags: [Sharing]
      summary: List reserved names
      description: |
        The account's reserved preview names and its teams' names. `limit` and `used` count its own
        names against its plan; names kept inside a team count against the team (`teams`).
        Rate limited to 120 requests a minute.
      responses:
        "200":
          description: Names and counts
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelNameList"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

    post:
      operationId: reserveTunnelName
      tags: [Sharing]
      summary: Reserve a name
      description: |
        Keeps a preview name (Pro and Business). With `team` it belongs to that team, and every
        member may share under it. Names are 3 to 40 lowercase letters, digits and single hyphens,
        never ending in `-free` or shaped like a random preview name. Rate limited to 30 requests
        per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 40
                team:
                  type: string
                  description: A team id, to keep the name inside that team
      responses:
        "201":
          description: Reserved
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    $ref: "#/components/schemas/TunnelName"
        "200":
          description: Already yours
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    $ref: "#/components/schemas/TunnelName"
        "400":
          description: Not a valid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Free plan, the plan's or team's names are all used, a blocked name, sharing suspended, or an unclaimed agent sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Someone else holds that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  /api/tunnel-names/{name}:
    parameters:
      - $ref: "#/components/parameters/tunnelName"
    delete:
      operationId: releaseTunnelName
      tags: [Sharing]
      summary: Release a name
      description: |
        Releases a name the account reserved, or as a team's owner one of its names. A preview
        running under it stops. Rate limited to 30 requests per 10 minutes.
      responses:
        "200":
          description: Released
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: A team name another member reserved, in a team you do not own, or an unclaimed agent sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Name not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  /api/tunnel-names/{name}/password:
    parameters:
      - $ref: "#/components/parameters/tunnelName"
    put:
      operationId: setTunnelNamePassword
      tags: [Sharing]
      summary: Set a name's password
      description: |
        Every preview under the name asks visitors for this password, a running one included (Pro
        and Business). Only a hash is kept. Rate limited to 30 requests per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 200
      responses:
        "200":
          description: The password is set
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelPasswordResult"
        "400":
          description: No password, or one that is too short or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No passwords on this plan, not allowed to change this name, or sharing suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Name not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

    delete:
      operationId: clearTunnelNamePassword
      tags: [Sharing]
      summary: Clear a name's password
      description: Removes the name's password. Rate limited to 30 requests per 10 minutes.
      responses:
        "200":
          description: The password is cleared
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelPasswordResult"
        "403":
          description: Not allowed to change this name, or sharing suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Name not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedRateLimited"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalErrorRateLimited"
        "503":
          $ref: "#/components/responses/SharingUnavailable"

  # -- Agents ------------------------------------------------------------------

  /api/agent/identity/challenge:
    post:
      operationId: createAgentChallenge
      tags: [Agents]
      summary: Get a proof-of-work challenge
      description: |
        Issues a proof-of-work challenge for anonymous agent registration (scheme
        `sha256-zero-bits`). No body and no credentials. Solve it by finding, for each sub-puzzle
        `i` from `0` to `count - 1`, a decimal nonce such that SHA-256 of the UTF-8 string
        `<challenge>.<i>.<nonce>` starts with `difficulty` zero bits, then send the nonces as
        `proof_of_work` to `POST /api/agent/identity` before `expires_at`. Each challenge works
        once. The SDKs ship a solver.

        Rate limited to 30 requests per minute per IP.
      security: []
      responses:
        "200":
          description: A fresh challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowChallenge"
        "400":
          description: Anonymous registration is turned off (`anonymous_not_enabled`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/agent/identity:
    post:
      operationId: registerAgent
      tags: [Agents]
      summary: Register an agent
      description: |
        Registers an agent (auth.md v0.6). `type` picks the kind of registration:

        - `anonymous`: needs a solved proof-of-work challenge. Returns an identity assertion for
          the sandbox (exchange it with the jwt-bearer grant for a `webhooks:sandbox` token) and a
          claim token. Sent without `proof_of_work`, the answer is `400 proof_of_work_required`
          carrying a fresh challenge, so an agent that skipped discovery registers in two calls.
        - `service_auth`: the agent names its human's email as `login_hint` and gets a claim
          attempt to show them. Nothing works until that human signs in and completes it; nothing
          is emailed.
        - `identity_assertion`: an ID-JAG from a trusted identity provider. Only available when
          the deployment trusts one; production trusts none, so this answers `issuer_not_enabled`.

        Errors are `{ error, error_description }` with auth.md's codes. Anonymous registration is
        rate limited per IP and globally, and refused while too many unclaimed registrations are
        live.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AnonymousRegistrationRequest"
                - $ref: "#/components/schemas/ServiceAuthRegistrationRequest"
                - $ref: "#/components/schemas/IdJagRegistrationRequest"
              discriminator:
                propertyName: type
                mapping:
                  anonymous: "#/components/schemas/AnonymousRegistrationRequest"
                  service_auth: "#/components/schemas/ServiceAuthRegistrationRequest"
                  identity_assertion: "#/components/schemas/IdJagRegistrationRequest"
      responses:
        "200":
          description: Registration created
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnonymousRegistration"
                  - $ref: "#/components/schemas/ServiceAuthRegistration"
                  - $ref: "#/components/schemas/IdJagRegistration"
                discriminator:
                  propertyName: registration_type
                  mapping:
                    anonymous: "#/components/schemas/AnonymousRegistration"
                    service_auth: "#/components/schemas/ServiceAuthRegistration"
                    identity_assertion: "#/components/schemas/IdJagRegistration"
        "400":
          description: |
            The registration was refused. Codes: `invalid_request`, `proof_of_work_required` and
            `invalid_challenge` (both carry a fresh challenge to solve), `anonymous_not_enabled`,
            `invalid_login_hint` (not one plain address, or an address at the capture domain),
            `issuer_not_enabled`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ProofOfWorkRequiredError"
                  - $ref: "#/components/schemas/AgentError"
        "401":
          description: |
            ID-JAG only. `login_required` (with `max_age`): `auth_time` is missing or too old,
            re-authenticate at the provider. `interaction_required`: the identity's email belongs
            to an existing account; show the human the `claim` block and poll the claim grant.
            Both carry a `WWW-Authenticate: AgentAuth` header.
          headers:
            WWW-Authenticate:
              description: 'An `AgentAuth` challenge, for example `AgentAuth error="login_required", max_age="3600"`'
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/IdJagInteractionRequired"
                  - $ref: "#/components/schemas/AgentError"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/agent/identity/claim:
    post:
      operationId: startAgentClaim
      tags: [Agents]
      summary: Start a claim attempt
      description: |
        Starts a claim attempt (auth.md Step 4a): the agent asks a human to connect it to their
        account. Send the `claim_token` from registration and `email`, the address of the one
        person who may complete the claim. An anonymous registration must send `email`; a
        `service_auth` registration keeps the email it registered with and may leave it out.

        Show the human `claim_attempt.verification_uri` and `claim_attempt.user_code`. They sign
        in (or sign up) with that email and type the code; meanwhile the agent polls the claim
        grant at `POST /api/oauth2/token` every `interval` seconds. Calling this again replaces
        the current attempt, and the old link stops working. A registration may start 10
        attempts.

        Rate limited to 20 requests per hour per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token]
              properties:
                claim_token:
                  type: string
                  pattern: "^clm_"
                  description: The claim token returned at registration
                email:
                  type: string
                  format: email
                  description: |
                    The human's email address. Required for anonymous registrations. Addresses at
                    the capture domain (`mailhooks.cc`) are refused.
      responses:
        "200":
          description: Claim attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAttemptStarted"
        "400":
          description: "`invalid_request` or `invalid_login_hint`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "401":
          description: "`invalid_claim_token`: unknown or revoked claim token. Register again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "409":
          description: "`claimed_or_in_flight`: already claimed. Poll the claim grant to collect it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "410":
          description: "`claim_expired`: the registration expired. Register again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "429":
          description: |
            `rate_limited` (wait for `Retry-After`), or `too_many_attempts` (the registration used
            all its claim attempts; register again)
          headers:
            Retry-After:
              description: Seconds to wait (with `rate_limited`)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "500":
          $ref: "#/components/responses/AgentServerError"

  /api/agent/sandbox/endpoints:
    get:
      operationId: listSandboxEndpoints
      tags: [Agents]
      summary: List sandbox endpoints
      description: |
        Lists the live sandbox endpoints of the registration behind the bearer token, newest
        first. Takes the access token of an anonymous, unclaimed registration (scope
        `webhooks:sandbox`); API keys and account tokens get `403 sandbox_only`. Reads are
        limited to 120 per minute per registration.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      responses:
        "200":
          description: Sandbox endpoints and the registration's limits
          content:
            application/json:
              schema:
                type: object
                required: [endpoints, sandbox]
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/SandboxEndpoint"
                  sandbox:
                    $ref: "#/components/schemas/SandboxLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"

    post:
      operationId: createSandboxEndpoint
      tags: [Agents]
      summary: Create sandbox endpoint
      description: |
        Creates a sandbox endpoint for the bearer's registration. It captures webhooks at
        `https://go.webhooks.cc/w/{slug}` and lives as long as the registration (24 hours unless
        claimed). It has no settings: no mock responses, notifications, signing, forwarding or
        email, and any request body is ignored.

        Limits: 3 live endpoints per registration, 25 captures per endpoint, 100 captures per
        registration, and a pool shared by all registrations. Rate limited to 20 creates per hour
        per registration. When a human claims the registration, its sandbox endpoints move into
        their account.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      responses:
        "201":
          description: Created sandbox endpoint
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "409":
          description: "`sandbox_endpoint_limit`: the registration holds 3 endpoints. Delete one first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"
        "503":
          description: "`sandbox_full`: the shared pool is full. Retry later, or ask a human to sign up."
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"

  /api/agent/sandbox/endpoints/{slug}:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: getSandboxEndpoint
      tags: [Agents]
      summary: Get sandbox endpoint
      description: |
        One sandbox endpoint of the bearer's registration. A slug of another registration, or of
        any account, answers the same `404` as a missing one.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      responses:
        "200":
          description: Sandbox endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"

    delete:
      operationId: deleteSandboxEndpoint
      tags: [Agents]
      summary: Delete sandbox endpoint
      description: |
        Deletes the sandbox endpoint and its captures, freeing a slot in the pool. The
        registration's capture budget is not refunded.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      responses:
        "204":
          description: Sandbox endpoint deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "500":
          $ref: "#/components/responses/AgentServerError"

  /api/agent/sandbox/endpoints/{slug}/requests:
    parameters:
      - $ref: "#/components/parameters/slug"

    get:
      operationId: listSandboxRequests
      tags: [Agents]
      summary: List sandbox requests
      description: |
        Requests a sandbox endpoint captured, newest first, in the same shape as
        `GET /api/endpoints/{slug}/requests`.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of requests to return (at most 100)
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
          description: Only return requests received at or after this Unix timestamp (ms)
      responses:
        "200":
          description: Array of captured requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "400":
          description: "`invalid_request`: `limit` or `since` is not a valid number"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"

  /api/agent/sandbox/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Request ID

    get:
      operationId: getSandboxRequest
      tags: [Agents]
      summary: Get sandbox request
      description: |
        One captured request, when one of the bearer's sandbox endpoints captured it. Any other
        id answers `404`.
      security:
        - BearerAuth: []
        - OAuth2: [webhooks:sandbox]
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "429":
          $ref: "#/components/responses/AgentRateLimited"
        "500":
          $ref: "#/components/responses/AgentServerError"

  # -- OAuth -------------------------------------------------------------------

  /api/oauth2/token:
    post:
      operationId: issueToken
      tags: [OAuth]
      summary: Token endpoint
      description: |
        Issues access tokens (RFC 6749). The request is form-encoded
        (`application/x-www-form-urlencoded`); JSON is accepted too. `grant_type` picks one of
        four grants:

        - `authorization_code`: redeems the code from `https://webhooks.cc/oauth/authorize` with
          its PKCE `code_verifier`. Returns an access token and a refresh token.
        - `refresh_token`: trades a refresh token for a new access token and a new refresh token.
          Refresh tokens rotate. A client that lost the answer may retry with the old one within
          60 seconds and gets a new pair; after that, the old one (or one a retry replaced) ends
          the connection. A refresh token stops working after 90 days unused.
        - `urn:ietf:params:oauth:grant-type:jwt-bearer` (RFC 7523, auth.md Step 5): exchanges a
          registered agent's identity assertion for a one-hour access token. A pre-claim
          assertion yields a `webhooks:sandbox` token (no user); a claimed one yields
          `webhooks:read webhooks:write`. A registration keeps at most 5 live tokens; a new one
          drops the oldest.
        - `urn:workos:agent-auth:grant-type:claim` (auth.md Step 4c): the agent's poll during a
          claim, in RFC 8628's vocabulary. Answers `authorization_pending` until the human enters
          the code, then once returns account credentials and a claimed identity assertion; the
          claim token is used up by that answer. Poll at most every 5 seconds or the answer is
          `slow_down`.

        Every access token is an ordinary `whcc_` bearer token. Answers carry
        `Cache-Control: no-store` and `Pragma: no-cache`, and errors use the RFC 6749 section 5.2
        envelope. Rate limited per IP: 600 requests per minute for `authorization_code` and
        `refresh_token`, 60 for the jwt-bearer and claim grants.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeGrant"
                - $ref: "#/components/schemas/RefreshTokenGrant"
                - $ref: "#/components/schemas/JwtBearerGrant"
                - $ref: "#/components/schemas/ClaimGrant"
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: "#/components/schemas/AuthorizationCodeGrant"
                  refresh_token: "#/components/schemas/RefreshTokenGrant"
                  "urn:ietf:params:oauth:grant-type:jwt-bearer": "#/components/schemas/JwtBearerGrant"
                  "urn:workos:agent-auth:grant-type:claim": "#/components/schemas/ClaimGrant"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: |
            RFC 6749 error. Codes: `invalid_request`, `invalid_grant` (the code, refresh token or
            assertion is invalid, expired, used or revoked, or was issued to another `client_id`
            or redirect URI; for a registered agent, register again), `unsupported_grant_type`,
            `invalid_target` (a `resource` this server does not serve). The claim grant adds RFC
            8628's `authorization_pending`, `slow_down`, `expired_token` and `access_denied`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "500":
          $ref: "#/components/responses/OAuthServerError"
        "503":
          description: "`temporarily_unavailable`: token issuance is not configured on this server"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/oauth2/revoke:
    post:
      operationId: revokeToken
      tags: [OAuth]
      summary: Revoke a token
      description: |
        Revokes an access token or a refresh token (RFC 7009) issued by `POST /api/oauth2/token`.
        API keys made on the dashboard are never revoked here. The answer is `200` with an empty
        body whether or not the token existed. Revoking a registered agent's access token leaves
        its identity assertion valid for a new exchange.

        Rate limited to 60 requests per minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The access token (`whcc_...`) or refresh token to revoke
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Which kind of token `token` is. Optional; the server finds out itself.
      responses:
        "200":
          description: Revoked, or the token was unknown. Empty body.
        "400":
          description: "`invalid_request`: `token` is missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "500":
          $ref: "#/components/responses/OAuthServerError"

  /api/oauth2/register:
    post:
      operationId: registerOAuthClient
      tags: [OAuth]
      summary: Register an OAuth client
      description: |
        Dynamic client registration (RFC 7591) for OAuth clients that do not host a Client ID
        Metadata Document. Clients are public: no client secret is issued, and the client is
        registered with `token_endpoint_auth_method` `none` whatever it asked for (RFC 7591
        section 3.2.1); it proves itself with PKCE. Use the returned `client_id` at
        `https://webhooks.cc/oauth/authorize` and the token endpoint. Rate limited to 20
        registrations per hour per IP; a client nobody uses is deleted after a day.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientMetadata"
      responses:
        "201":
          description: Client registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        "400":
          description: |
            RFC 7591 error: `invalid_redirect_uri` (no redirect URIs, more than 10, more than 4096
            characters together, or one that is not allowed: see `redirect_uris`) or
            `invalid_client_metadata` (`grant_types` without `authorization_code`, or
            `response_types` without `code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "500":
          $ref: "#/components/responses/OAuthServerError"

  # -- Public ------------------------------------------------------------------

  /api/approvals/{id}:
    get:
      operationId: getApproval
      tags: [Account]
      summary: Poll an approval
      description: >-
        Only the API key that asked (or any token of the same connected agent) may poll. Once the
        owner approves a new API key, the next poll creates it and carries it in `result`, once:
        later polls answer `completed` without it. Other actions run when the owner approves
        them, and every later poll carries their `result`. Poll every two seconds at most.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The approval, and its result once there is one
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
                  result:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/api-keys:
    get:
      operationId: listApiKeys
      tags: [Account]
      summary: List API keys
      description: The account's API keys, newest first. Agent tokens are not listed, and a key is never shown again.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    key_prefix:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: [string, "null"]
                      format: date-time
                    last_used_at:
                      type: [string, "null"]
                      format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      tags: [Account]
      summary: Ask for a new API key
      description: >-
        With an API key or agent token, answers 202 with an approval; once the owner approves,
        the asker's next poll of `GET /api/approvals/{id}` carries the key, once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: revokeApiKey
      tags: [Account]
      summary: Revoke an API key
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked (also when no key matched)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/account:
    patch:
      operationId: renameAccount
      tags: [Account]
      summary: Set the display name
      description: >-
        With an API key or agent token, a new `name` answers 202 with an approval, and the name
        changes when the owner approves it. `approvalEmails` takes a browser session (403 with a
        key).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: [string, "null"]
                  description: The new display name, or null to clear it
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/agent/registrations:
    get:
      operationId: listConnectedAgents
      tags: [Account]
      summary: List connected agents
      responses:
        "200":
          description: Connected agents, most recently connected first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    clientName:
                      type: [string, "null"]
                    kind:
                      type: string
                    connectedAt:
                      type: integer
                    lastUsedAt:
                      type: [integer, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/agent/registrations/{id}:
    delete:
      operationId: disconnectAgent
      tags: [Account]
      summary: Disconnect an agent
      description: Its tokens stop working at once; endpoints it brought stay in the account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/request-shares:
    get:
      operationId: listShareLinks
      tags: [Account]
      summary: List share links
      description: Every live public link to a frozen copy of a request, newest first. A link's page is `/s/{token}`.
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ShareLink"
                    - type: object
                      properties:
                        method:
                          type: string
                        path:
                          type: string
                        detectedProvider:
                          type: [string, "null"]
                        detectedEvent:
                          type: [string, "null"]
                        requestId:
                          type: [string, "null"]
                        endpointSlug:
                          type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/request-shares/{id}:
    delete:
      operationId: revokeShareLink
      tags: [Account]
      summary: Revoke a share link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked; the page answers 404 from now on
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{id}/shares:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRequestShareLinks
      tags: [Account]
      summary: List a request's share links
      responses:
        "200":
          description: The request's live links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createShareLink
      tags: [Account]
      summary: Ask for a share link
      description: >-
        A link publishes a read-only copy of the request (never an email) to anyone who holds it,
        so with an API key or agent token this answers 202 with an approval. The link is made
        when the owner approves, and every later poll carries `{ id, url, expiresAt,
        redactedHeaders }`. Credential headers are always left out; `hideSensitive` also leaves
        out signature and token headers. Only the endpoint's owner can share.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiresInDays]
              properties:
                expiresInDays:
                  type: integer
                  enum: [1, 7, 30]
                hideSensitive:
                  type: boolean
                  default: true
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the endpoint's owner
        "404":
          $ref: "#/components/responses/NotFound"

  /api/domains:
    parameters:
      - $ref: "#/components/parameters/DomainTeam"
    get:
      operationId: listDomains
      tags: [Account]
      summary: List custom inbound domains
      responses:
        "200":
          description: The domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboundDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addDomain
      tags: [Account]
      summary: Add a custom inbound domain
      description: Business (or Team Business). Publish the TXT and MX records in `records`, then verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    $ref: "#/components/schemas/InboundDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/domains/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/DomainTeam"
    patch:
      operationId: routeDomain
      tags: [Account]
      summary: Set a domain's routing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catchAllEndpointId, routes]
              properties:
                catchAllEndpointId:
                  type: [string, "null"]
                  format: uuid
                routes:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/InboundDomainRoute"
      responses:
        "200":
          description: The domain with its new routing
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    $ref: "#/components/schemas/InboundDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeDomain
      tags: [Account]
      summary: Ask to remove a domain
      description: >-
        Mail to a removed domain is refused, so with an API key or agent token this answers 202
        with an approval. The domain is removed when the owner approves, and every later poll
        carries `{ removed, domainId }`.
      responses:
        "202":
          $ref: "#/components/responses/ApprovalAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/domains/{id}/verify:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/DomainTeam"
    post:
      operationId: verifyDomain
      tags: [Account]
      summary: Check a domain's DNS records now
      responses:
        "200":
          description: What the lookup found
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    $ref: "#/components/schemas/InboundDomain"
                  records:
                    type: object
                    properties:
                      txt:
                        type: boolean
                      mx:
                        type: boolean
                  tookOver:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/stats:
    get:
      operationId: getStats
      tags: [Usage]
      summary: Get public stats
      description: Public aggregate statistics. No authentication required. Cached for 1 hour.
      security: []
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_webhooks:
                    type: integer
                  total_endpoints:
                    type: integer
                  total_users:
                    type: integer

  /api/health:
    get:
      operationId: getHealth
      tags: [Usage]
      summary: Health check
      description: Check API and database health. No authentication required.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, error]
        "503":
          description: Service degraded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, error]

# -- Components ----------------------------------------------------------------

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key with `whcc_` prefix. Generate from https://webhooks.cc/account.

        Access tokens issued by `POST /api/oauth2/token` (OAuth 2.1 clients and registered agents)
        are `whcc_` bearer tokens too and go in the same header.

    OAuth2:
      type: oauth2
      description: |
        OAuth 2.1 for apps and MCP clients that act for a signed-in webhooks.cc user.

        - **PKCE is required**, with `code_challenge_method=S256`. Plain challenges are refused.
        - **Clients are public** (`token_endpoint_auth_method: none`): there is no client secret.
        - **`client_id`** is either a Client ID Metadata Document URL (an https URL the client
          hosts, which serves its metadata) or an id issued by dynamic client registration
          (`POST /api/oauth2/register`, RFC 7591).
        - The authorization endpoint (`https://webhooks.cc/oauth/authorize`) asks the user to sign
          in and approve the client, then redirects to `redirect_uri` with `code`, `state` and
          `iss` (RFC 9207). Check that `iss` is `https://webhooks.cc` before redeeming the code.
        - Redeem the code at the token endpoint with the `code_verifier`. The answer carries an
          access token and a refresh token. **Refresh tokens rotate**: each refresh returns a new
          one and the old one stops working.
        - Server metadata: `https://webhooks.cc/.well-known/oauth-authorization-server` (RFC 8414).

        The access token is an ordinary `whcc_` bearer token, accepted on the whole API and on the
        remote MCP server at `https://webhooks.cc/mcp`.

        **Scopes are advisory.** Account tokens always carry `webhooks:read` and `webhooks:write`;
        the routes decide what a token reaches. Tokens of an agent registration that no human has
        claimed yet carry only `webhooks:sandbox`: they have no user, work only on the
        `/api/agent/sandbox/*` routes, and get `403` on account routes.

        Agents that register without a human (anonymous or with their human's email) follow
        https://webhooks.cc/auth.md instead of this flow and use the jwt-bearer and claim grants
        of the same token endpoint.
      flows:
        authorizationCode:
          authorizationUrl: https://webhooks.cc/oauth/authorize
          tokenUrl: https://webhooks.cc/api/oauth2/token
          refreshUrl: https://webhooks.cc/api/oauth2/token
          scopes:
            webhooks:read: Read endpoints, requests and usage
            webhooks:write: Create, change and delete endpoints and requests
            webhooks:sandbox: |
              Pre-claim agent tokens: the agent sandbox only. Issued by the jwt-bearer grant to
              anonymous agent registrations, never by this flow.

  parameters:
    DomainTeam:
      name: team
      in: query
      required: false
      description: A Team Business team's id, for its domains (the team's owner only)
      schema:
        type: string
        format: uuid
    extracts:
      name: extracts
      in: query
      schema:
        type: string
        enum: ["true", "false"]
      description: |
        `true` adds `extracts` (the one-time codes and links found in it) to each captured email.
        Off by default.

    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,50}$"
      description: Endpoint slug (URL-safe identifier)

    destinationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Destination ID

    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
      description: Team ID

    shareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: A share's id, from `GET /api/shares`

    tunnelName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{3,40}$"
      description: A reserved preview name, as in `<name>.sharehooks.cc`

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed in the current window
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining requests in the current window
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp (seconds) when the window resets
      schema:
        type: integer
    X-Search-Complete:
      description: |
        `true` when the search read everything in the range, `false` when it
        stopped early (a full page or the time limit) and there may be more.
      schema:
        type: string
        enum: ["true", "false"]
    X-Search-Searched-Until:
      description: |
        How far the search has read, as a Unix timestamp (ms): everything
        between the near end of the range and this time was searched. Absent
        when a complete search had no bound on that side.
      schema:
        type: integer
    X-Search-Cursor:
      description: |
        Opaque position to send as `cursor` to continue. Absent when the
        search is complete.
      schema:
        type: string

  schemas:
    Approval:
      type: object
      required: [id, status, action, summary, code, url, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, denied, completed, expired]
        action:
          type: string
          enum:
            [
              api_keys.create,
              request_shares.create,
              domains.remove,
              account.rename,
              google.connect,
              google.pick,
              ai.assist,
            ]
        summary:
          type: string
          description: One sentence saying what the owner is asked to allow
        code:
          type: string
          description: Shown on the approval page too, for the owner to compare
        url:
          type: string
          format: uri
          description: The approval page, for the account's owner to open
        expiresAt:
          type: string
          format: date-time
    ShareLink:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        createdAt:
          type: integer
        expiresAt:
          type: integer
        redactedHeaders:
          type: array
          items:
            type: string
    InboundDomainRoute:
      type: object
      required: [localPart, endpointId]
      properties:
        localPart:
          type: string
          maxLength: 64
        endpointId:
          type: string
          format: uuid
    InboundDomain:
      type: object
      properties:
        id:
          type: string
        domain:
          type: string
        status:
          type: string
          enum: [pending, verified, lapsed]
        verifiedAt:
          type: [string, "null"]
          format: date-time
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
        failedChecks:
          type: integer
        catchAllEndpointId:
          type: [string, "null"]
        routes:
          type: array
          items:
            $ref: "#/components/schemas/InboundDomainRoute"
        records:
          type: object
          description: The TXT and MX records to publish ({ name, value } each)
          additionalProperties: true
        active:
          type: boolean
          description: Receives mail now
    AlertSettings:
      type: object
      properties:
        enabled:
          type: boolean
        fieldFailures:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Emails in a row that miss a required field before an alert opens
        fieldFailureShare:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Percent of the last 20 emails that missed a field
        requiredFields:
          type: [array, "null"]
          items:
            type: string
        silenceHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 720
        destinationFailures:
          type: boolean
        notifyEmail:
          type: boolean
        notifyDestinationIds:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Endpoint:
      type: object
      required: [id, slug, createdAt]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        url:
          type: string
          description: Full webhook URL (e.g. https://go.webhooks.cc/w/{slug})
        mockResponse:
          $ref: "#/components/schemas/MockResponse"
        responseRules:
          type: array
          items:
            $ref: "#/components/schemas/ResponseRule"
          description: Ordered conditional response rules. First matching rule wins, then falls back to mockResponse.
        notificationUrl:
          type: ["string", "null"]
          format: uri
          description: |
            A Slack or Discord webhook (or any URL) that gets a short message for each captured
            request, through a chat destination named Notifications. Only returned to the
            endpoint's owner.
        isEphemeral:
          type: boolean
        expiresAt:
          type: integer
          description: Unix timestamp (ms) when the endpoint expires
        createdAt:
          type: integer
          description: Unix timestamp (ms)
        sharedWith:
          type: array
          items:
            $ref: "#/components/schemas/TeamShare"
          description: Teams this endpoint is shared with (present when you own it)
        fromTeam:
          $ref: "#/components/schemas/TeamShare"
          description: Oldest share among your teams (present when shared with you)
        fromTeams:
          type: array
          items:
            $ref: "#/components/schemas/TeamShare"
          description: Every subscribed team of yours this endpoint is shared with (present when shared with you)
        emailAddress:
          type: ["string", "null"]
          description: |
            Address that delivers email to this endpoint (`{slug}@mailhooks.cc`). Null for endpoints
            without an owner (guest endpoints), which receive no email.
        showEmailExtracts:
          type: boolean
          default: true
          description: |
            Whether the one-time codes and links found in emails are shown in the dashboard and
            included (as `codes` and `links`) in forwarded JSON
        site:
          $ref: "#/components/schemas/EndpointSite"
        favorite:
          type: boolean
          description: |
            Whether the caller marked the endpoint as a favourite (their own, also on a shared
            endpoint). Present on List endpoints and Get endpoint.
        emailFields:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/EmailField"
          description: Named fields picked out of every email
        signingProvider:
          type: ["string", "null"]
          description: |
            The provider whose signature every incoming request is checked against (`stripe`,
            `github`, ..., or `generic-hmac`); null when verification is off.
        hasSigningSecret:
          type: boolean
          description: Whether a signing secret is saved. The secret itself is never included.
        signingHeader:
          type: ["string", "null"]
          description: The header that carries the signature, for `generic-hmac`
        forwardEnabled:
          type: boolean
          description: |
            Whether the primary destination is on. The `forward*` fields are the older single-URL
            API and stand for the endpoint's primary destination; the destination routes manage
            all of them.
        forwardUrl:
          type: ["string", "null"]
          format: uri
          description: The primary destination's URL. Only returned to the endpoint's owner.
        hasForwardSecret:
          type: boolean
          description: Whether a forwarding secret exists. The secret itself is never included.
        forwardHttp:
          type: boolean
          description: The primary destination receives HTTP requests
        forwardEmail:
          type: boolean
          description: The primary destination receives emails
        forwardFormat:
          type: string
          enum: [auto, as_received, json, chat]
        forwardHeaders:
          type: array
          items:
            $ref: "#/components/schemas/DestinationHeader"
          description: Your own headers, values masked. Only returned to the endpoint's owner.
        forwardAppendPath:
          type: boolean
        forwardRetrySeconds:
          type: integer
          enum: [0, 3600, 86400]
        forwardKeepOrder:
          type: boolean
        forwardSentField:
          type: ["string", "null"]
        destinationCount:
          type: integer
          description: How many destinations the endpoint has
        retentionDays:
          type: ["integer", "null"]
          description: Days requests are kept here; null keeps them as long as the plan does. Owner only.
        retentionCapDays:
          type: integer
          description: The longest retention this endpoint may have, its billing account's plan's. Owner only.
        deleteAfterDelivery:
          type: boolean
          description: Requests are deleted once every delivery is settled. Owner only.
        agentRepo:
          type: ["string", "null"]
          description: The GitHub repository (owner/name) a coding agent fixes failed deliveries in; fix prompts open there, and failed-delivery alert emails link to one. Null when none is set.
        layouts:
          type: array
          items:
            $ref: "#/components/schemas/Layout"
          description: How the endpoint reads its emails; the first that matches applies. Owner only.
        layoutsCap:
          type: integer
          description: Layouts the plan uses; later ones are kept but not matched. Owner only.

    Layout:
      type: object
      required: [id, name]
      description: How an endpoint reads the emails of one sender or kind (see /docs/layouts).
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean
          default: true
        match:
          type: object
          description: When it applies, in the rule language of destination filters; no conditions takes every email.
          properties:
            logic:
              type: string
              enum: [and, or]
            conditions:
              type: array
              maxItems: 10
              items:
                $ref: "#/components/schemas/Condition"
        fields:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, from, pattern]
            properties:
              name:
                type: string
              from:
                type: string
                enum: [subject, text, html, from, to, header]
              header:
                type: string
              pattern:
                type: string
                description: RE2; the first group is the value
        lineItems:
          type: ["object", "null"]
          required: [from]
          properties:
            from:
              type: string
              enum: [text, html, attachment]
            pattern:
              type: string
              description: For text and html, RE2 with named groups found again and again; each match is a row
            start:
              type: string
            end:
              type: string
            attachment:
              type: string
              description: For attachments, the file name with * and ? wildcards
            sheet:
              type: string
            columns:
              type: array
              maxItems: 30
              items:
                type: object
                required: [name, column]
                properties:
                  name:
                    type: string
                  column:
                    type: string
                    description: The header's text or a column letter
        parseAttachments:
          type: boolean
          description: Parse CSV, TSV, XLSX, XLS, ODS, PDF text and text attachments; uses parsed pages

    ParsedEmail:
      type: object
      description: What the endpoint's layouts found in an email.
      properties:
        status:
          type: string
          enum: [matched, no_layout]
        layout:
          type: ["object", "null"]
          properties:
            id:
              type: string
            name:
              type: string
        fields:
          type: object
          additionalProperties:
            type: ["string", "null"]
        lineItems:
          type: array
          items:
            type: object
            additionalProperties:
              type: ["string", "null"]
        lineItemColumns:
          type: array
          items:
            type: string
          description: The line items' columns in order
        attachments:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              filename:
                type: ["string", "null"]
              format:
                type: string
              pages:
                type: integer
              sheets:
                type: array
                items:
                  type: object
              text:
                type: ["string", "null"]
              truncated:
                type: boolean
              error:
                type: ["string", "null"]
                description: limit, not_kept, not_parsed, too_large, malformed, encrypted, zip_bomb or empty
        pages:
          type: integer
          description: Parsed pages this email used

    EmailField:
      type: object
      description: A named value picked out of every email (see /docs/email-capture#fields-you-pick-out).
      required: [name, from, pattern]
      properties:
        name:
          type: string
          description: How templates and filters refer to it; letters, digits and `_`, starting with a letter
        from:
          type: string
          enum: [subject, text, html, from, to, header]
          description: What it reads; `html` is the HTML as text, `header` needs `header`
        header:
          type: string
          description: "The header's name, for `from: header`"
        pattern:
          type: string
          maxLength: 300
          description: RE2 syntax; the first group is the value, or the whole match without one

    Condition:
      type: object
      description: |
        One condition of the rule language that response rules, destination filters and layouts
        share. Regular expressions are RE2. Response rules can use `method`, `path`, `header`,
        `query`, `body`, `body_contains`, `body_path`, `content_type` and `size`; filters and
        layouts can use every field.
      required: [field, op]
      properties:
        field:
          type: string
          enum:
            [
              method,
              path,
              header,
              query,
              body,
              body_contains,
              body_path,
              content_type,
              size,
              kind,
              email,
              email_field,
              spam_score,
              email_auth,
              signature,
            ]
          description: |
            What to look at. `kind` is `http` or `email`; `email` reads a part of an email (`name`:
            `subject`, `from`, `to`, `text` or `tag`); `email_field` one of the endpoint's named
            fields (`name`); `email_auth` a sender check (`name`: `spf`, `dkim` or `dmarc`);
            `signature` compares with `verified`, `failed` or `missing`.
        op:
          type: string
          enum:
            [
              eq,
              neq,
              contains,
              not_contains,
              starts_with,
              ends_with,
              matches,
              regex,
              exists,
              not_exists,
              gt,
              gte,
              lt,
              lte,
            ]
          description: How to compare; not every field takes every operator (a wrong pair returns `400`)
        value:
          type: string
          maxLength: 4096
          description: What to compare with; not used by `exists` and `not_exists`
        name:
          type: string
          maxLength: 256
          description: Header or query parameter name, the email part, the named field, or the sender check
        path:
          type: string
          maxLength: 256
          description: Dot path into the JSON (or form) body, for `body_path`

    ResponsePreview:
      type: object
      required: [rule, response, unknownPlaceholders, email, request]
      properties:
        rule:
          type: ["object", "null"]
          description: The rule that matched; null when the endpoint's default response answers
          properties:
            index:
              type: integer
              description: Its position in the list, from 0
            name:
              type: ["string", "null"]
        response:
          type: ["object", "null"]
          description: The response sent, placeholders filled in; null is the plain `200 OK`
          properties:
            status:
              type: integer
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string
            delay:
              type: integer
              description: Milliseconds
        unknownPlaceholders:
          type: array
          items:
            type: string
          description: Placeholders the receiver leaves as written, a hint about typos
        email:
          type: boolean
          description: True when the request is an email, which gets a mail server's reply and never a mock response
        request:
          type: object
          description: The request the preview ran on
          properties:
            id:
              type: ["string", "null"]
              description: Null for a sample
            method:
              type: string
            path:
              type: string
            receivedAt:
              type: integer
            sample:
              type: boolean

    MockResponse:
      type: object
      required: [status, body, headers]
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code
        body:
          type: string
          description: Response body
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers
        delay:
          type: integer
          minimum: 0
          maximum: 30000
          description: Response delay in milliseconds

    ResponseRuleCondition:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          enum: [method, path, header, query, body, body_contains, body_path, content_type, size]
          description: Request field to match against
        op:
          type: string
          enum:
            [
              eq,
              neq,
              contains,
              not_contains,
              starts_with,
              ends_with,
              matches,
              regex,
              exists,
              not_exists,
              gt,
              gte,
              lt,
              lte,
            ]
          description: |
            Comparison operator. Not every field takes every operator (`method` takes `eq` and
            `neq`, `size` the number comparisons); a wrong pair returns `400`. `matches` is a
            glob, `regex` an RE2 regular expression.
        value:
          type: string
          maxLength: 4096
          description: Value to compare against (not used by `exists` and `not_exists`)
        name:
          type: string
          maxLength: 256
          description: Header name or query param name (required for header/query conditions)
        path:
          type: string
          maxLength: 256
          description: JSON dot-notation path (required for body_path conditions)

    ResponseRule:
      type: object
      required: [conditions, response]
      properties:
        id:
          type: string
          description: Stable identifier for UI reference
        name:
          type: string
          maxLength: 200
          description: Human-readable rule name
        enabled:
          type: boolean
          default: true
          description: Whether this rule is active
        logic:
          type: string
          enum: [and, or]
          default: and
          description: How to combine conditions ("and" = all must match, "or" = any must match)
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/ResponseRuleCondition"
          minItems: 1
          maxItems: 10
          description: Conditions to evaluate (1-10)
        response:
          $ref: "#/components/schemas/MockResponse"
          description: Response to return when conditions match

    CreateEndpointRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name
        isEphemeral:
          type: boolean
          description: Whether the endpoint should auto-expire
        expiresAt:
          type: integer
          description: Unix timestamp (ms) for expiry (implies ephemeral)
        mockResponse:
          $ref: "#/components/schemas/MockResponse"
        responseRules:
          type: array
          items:
            $ref: "#/components/schemas/ResponseRule"
          maxItems: 50
          description: Ordered conditional response rules (first match wins, max 50)
        notificationUrl:
          type: string
          format: uri
          maxLength: 2048
          description: URL to POST a JSON summary to after each captured request
        site:
          allOf:
            - $ref: "#/components/schemas/EndpointSite"
          default: both
          description: |
            Which site's dashboard lists the new endpoint. The dashboard sends the site it is on;
            left out, it is `both`.

    EndpointSite:
      type: string
      enum: [webhooks, mailhooks, both]
      description: |
        Which site's dashboard lists the endpoint: webhooks.cc, mailhooks.cc or both. Only the
        listing: every endpoint keeps its HTTP URL and email address and captures both, whatever
        this says.

    UpdateEndpointRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: New display name
        mockResponse:
          oneOf:
            - $ref: "#/components/schemas/MockResponse"
            - type: "null"
          description: Default mock response (used when no rule matches), or null to clear
        responseRules:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ResponseRule"
              maxItems: 50
            - type: "null"
          description: Conditional response rules, or null to clear
        notificationUrl:
          oneOf:
            - type: string
              format: uri
              maxLength: 2048
            - type: "null"
          description: Notification webhook URL, or null to clear. Owner only.
        showEmailExtracts:
          type: boolean
          description: |
            Show the codes and links found in emails, and include them in forwarded JSON.
            Owner only, because it changes what forwarding sends.
        site:
          allOf:
            - $ref: "#/components/schemas/EndpointSite"
          description: Which site's dashboard lists the endpoint. Owner only.
        emailFields:
          type: ["array", "null"]
          maxItems: 20
          items:
            $ref: "#/components/schemas/EmailField"
          description: Replaces the named email fields; null or [] removes them. Owner only.
        signingProvider:
          type: ["string", "null"]
          description: |
            Check every incoming request's signature as this provider signs (one of the providers
            the SDK verifies, such as `stripe` or `github`, or `generic-hmac`); null turns
            verification off. Owner only.
        signingSecret:
          type: ["string", "null"]
          maxLength: 10000
          description: The provider's signing secret. Write only. Owner only.
        signingHeader:
          type: ["string", "null"]
          maxLength: 256
          description: The header that carries the signature, for `generic-hmac`. Owner only.
        forwardEnabled:
          type: boolean
          description: |
            Switch the primary destination on or off. Needs a URL, sent in the same request or
            saved before. Owner only, like every `forward*` field; they are the older single-URL
            API, and the destination routes do the same for every destination.
        forwardUrl:
          oneOf:
            - type: string
              format: uri
              maxLength: 2048
            - type: string
              const: ""
            - type: "null"
          description: |
            The primary destination's URL, or null (or `""`) to remove it once forwarding is off.
            Must be `https` on a public host name: no IP addresses, `localhost`, credentials in
            the URL, or blocked ports (mail, database, and other internal services). Saving the
            first URL creates the signing secret. Owner only.
        forwardHttp:
          type: boolean
          description: Forward HTTP requests. Default false.
        forwardEmail:
          type: boolean
          description: Forward emails. Default true.
        forwardFormat:
          type: string
          enum: [auto, as_received, json, chat]
        forwardHeaders:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DestinationHeader"
          description: The whole list of your headers; a null value keeps the stored value of that name, [] removes them all.
        forwardAppendPath:
          type: boolean
        forwardRetrySeconds:
          type: integer
          enum: [0, 3600, 86400]
        forwardKeepOrder:
          type: boolean
        forwardSentField:
          type: ["string", "null"]
          description: A JSON body field with the sender's timestamp, such as `data.publishedAt`; null clears it.
        retentionDays:
          type: ["integer", "null"]
          minimum: 1
          maximum: 365
          description: Keep requests this many days (up to the plan's), or null for the plan's. Owner only.
        deleteAfterDelivery:
          type: boolean
          description: Delete each request once every delivery is settled. Owner only.
        agentRepo:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$"
          description: The GitHub repository (owner/name) a coding agent fixes failed deliveries in, or null to clear it. A trailing .git is dropped and a name of only dots is refused. Owner only.
        layouts:
          type: ["array", "null"]
          maxItems: 50
          items:
            $ref: "#/components/schemas/Layout"
          description: Replaces the layouts; null or [] removes them. Patterns are checked with RE2. Owner only.

    Request:
      type: object
      required: [id, endpointId, method, path, headers, queryParams, ip, size, receivedAt, kind]
      properties:
        id:
          type: string
        endpointId:
          type: string
        endpointSlug:
          type: string
          description: |
            The slug of the endpoint that captured it. Present on a request fetched by id
            (`GET /api/requests/{id}`, `GET /api/agent/sandbox/requests/{id}`); lists leave it
            out, since they name the endpoint.
        method:
          type: string
          description: HTTP method, or `EMAIL` for a captured email
        path:
          type: string
          description: Path after the slug, or the recipient address for a captured email
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Request headers. For an email, the message headers, lowercase names, repeated headers
            joined with a newline.
        body:
          type: string
          description: |
            Request body. For an email, the original message, or only its headers when the message
            was over 1 MB.
        bodyRaw:
          type: string
          description: Base64 of the exact body bytes, present only when the body is not valid UTF-8
        queryParams:
          type: object
          additionalProperties:
            type: string
        contentType:
          type: string
          description: Content-Type of the request; `message/rfc822` for an email
        ip:
          type: string
          description: Client IP, or the sending mail server's IP for an email
        size:
          type: integer
        receivedAt:
          type: integer
          description: Unix timestamp (ms)
        detectedProvider:
          type: ["string", "null"]
          description: The provider the request looks like it came from, from its headers and body (best effort)
        detectedEvent:
          type: ["string", "null"]
          description: The event it carries, when the provider names one
        signatureVerified:
          type: ["boolean", "null"]
          description: The result of the endpoint's signature verification; null when it is not configured
        signatureError:
          type: ["string", "null"]
        signingProvider:
          type: ["string", "null"]
          description: The provider the signature was checked as
        responseStatus:
          type: ["integer", "null"]
          description: |
            The HTTP status the endpoint answered the sender with, recorded when the request
            arrived; for a live capture (`whk tunnel --live`), what the sender got from the local
            app or the stand-in (see `liveResponse`). Null for emails and for requests captured
            before November 2026.
        responseRule:
          type: ["string", "null"]
          description: |
            The response rule that chose the answer: its name, or `Rule 2` for an unnamed one by
            its place in the list. Null when no rule matched.
        kind:
          type: string
          enum: [http, email]
          description: "`email` for a captured email, `http` for everything else"
        email:
          oneOf:
            - $ref: "#/components/schemas/EmailCapture"
            - type: "null"
          description: The parsed message when `kind` is `email`, null otherwise
        emailFields:
          type: ["object", "null"]
          additionalProperties:
            type: ["string", "null"]
          description: |
            Only with `extracts=true`, on a captured email: the endpoint's named fields by name
            (null where a pattern found nothing); null when the endpoint has none.
        replyText:
          type: ["string", "null"]
          description: |
            Only with `extracts=true`, on a captured email: the new text of a reply, without the
            quoted message.
        parsed:
          oneOf:
            - $ref: "#/components/schemas/ParsedEmail"
            - type: "null"
          description: What the endpoint's layouts found, once the parse is done (emails on endpoints with layouts)
        extracts:
          oneOf:
            - $ref: "#/components/schemas/EmailExtracts"
            - type: "null"
          description: |
            Only with `extracts=true`, and only on a captured email: the one-time codes and links
            found in it, as the dashboard shows them. Null when the endpoint's `showEmailExtracts`
            is off.
        liveResponse:
          oneOf:
            - $ref: "#/components/schemas/LiveResponse"
            - type: "null"
          description: |
            What the local app answered, for an HTTP request captured while `whk tunnel --live`
            relayed the endpoint. Null otherwise.

    LiveResponse:
      type: object
      description: |
        What the sender of a request got back while `whk tunnel --live` relayed the endpoint to an
        app on someone's computer, recorded once the answer finished.
      required: [status, headers, body, bodyTruncated, bodyEncoding, ms, outcome]
      properties:
        status:
          type: ["integer", "null"]
          description: The status the sender got, the app's or the stand-in's
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            The headers the sender got: the app's without Set-Cookie and security headers, plus the
            nosniff and sandbox CSP headers the receiver adds
        body:
          type: string
          description: The first 64 KB of the answer, as text, or base64 when `bodyEncoding` is `base64`
        bodyTruncated:
          type: boolean
          description: True when the answer was longer than what is kept, or cut off past 1 MB
        bodyEncoding:
          type: string
          enum: [utf8, base64]
        ms:
          type: ["integer", "null"]
          description: How long the app took, in milliseconds
        outcome:
          type: string
          enum: [answered, offline, timeout, unreachable, busy, refused]
          description: |
            `answered` when the app answered; otherwise what stood in: `offline` (502, whk not
            connected), `timeout` (504, no answer within 25 seconds), `unreachable` (502, nothing on
            the local port), `busy` (503 with `Retry-After`, too many relays waiting) or `refused`:
            the answer was not passed back as it was. 400 when the path left the endpoint; 502 when
            the answer was refused (a download, a script or another type an API does not answer
            with, or a stated size over 1 MB); or the app's own status when the answer streamed past
            1 MB and was cut off, so the sender got a broken stream

    TunnelShare:
      type: object
      description: "A `whk share` preview (`kind: share`) or a `whk tunnel --live` session (`kind: live`)"
      required:
        [
          id,
          kind,
          name,
          url,
          endpointSlug,
          client,
          startedAt,
          endedAt,
          endReason,
          expiresAt,
          bytes,
          requests,
          password,
          notice,
          mine,
          startedBy,
        ]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [share, live]
        name:
          type: ["string", "null"]
          description: The preview's name; null for a live tunnel
        url:
          type: ["string", "null"]
          description: The preview link, or the capture URL of a live tunnel
        endpointSlug:
          type: ["string", "null"]
          description: A live tunnel's endpoint
        client:
          type: string
          description: "What it runs on, as the CLI reported it: `laptop, macOS`"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        endReason:
          type: ["string", "null"]
          description: Why it ended, in words
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: When a time-limited (Free) preview ends
        bytes:
          type: integer
          description: Data visitors moved through a preview, both ways (downloads and uploads, WebSockets included); live tunnels count captures instead
        requests:
          type: integer
        password:
          type: boolean
          description: Whether visitors need a password
        notice:
          type: boolean
          description: Whether visitors see a short notice page first
        mine:
          type: boolean
          description: False for a teammate's run
        startedBy:
          oneOf:
            - type: object
              required: [id, email]
              properties:
                id:
                  type: string
                email:
                  type: string
            - type: "null"
          description: Who started it, for a teammate's run

    TunnelUsage:
      type: object
      description: This UTC month's shared data against the plan
      required: [month, bytes, limitBytes, over, resetsAt, message]
      properties:
        month:
          type: string
          example: "2026-11"
        bytes:
          type: integer
        limitBytes:
          type: integer
        over:
          type: boolean
          description: True once the month's data is used; previews pause until `resetsAt`
        resetsAt:
          type: string
          format: date-time
        message:
          type: ["string", "null"]
          description: Why previews are paused and when they open again, while `over`

    TunnelLimits:
      type: object
      description: The plan sharing follows, the best of the account's own and its subscribed teams'
      required: [plan, label, shares, reservedNames, sessionMinutes, dataGb, passwords, notice]
      properties:
        plan:
          type: string
          enum: [free, pro, business, team, team_business]
        label:
          type: string
          example: Pro
        shares:
          type: integer
          description: Previews at once
        reservedNames:
          type: integer
        sessionMinutes:
          type: ["integer", "null"]
          description: How long a preview may run, or null without a limit
        dataGb:
          type: integer
          description: Shared data a month
        passwords:
          type: boolean
        notice:
          type: boolean
          description: Whether visitors see a short notice page first

    TunnelShareList:
      type: object
      required: [shares, usage, limits, names, suspended, hints]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/TunnelShare"
        usage:
          $ref: "#/components/schemas/TunnelUsage"
        limits:
          $ref: "#/components/schemas/TunnelLimits"
        names:
          type: object
          required: [limit, used, usable]
          properties:
            limit:
              type: integer
              description: Own names the plan allows
            used:
              type: integer
              description: Own names kept
            usable:
              type: integer
              description: Names, own and teams', that can be shared under now
        suspended:
          type: boolean
          description: True when staff suspended sharing on the account
        hints:
          type: array
          items:
            type: string
          description: What the account can do next, as `whk` commands

    TunnelVisit:
      type: object
      required: [method, path, status, ms, bytes, at, country, device, visitor]
      properties:
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        ms:
          type: integer
        bytes:
          type: integer
        at:
          type: string
          format: date-time
        country:
          type: ["string", "null"]
          description: Two-letter country code
        device:
          type: string
          enum: [phone, tablet, computer, bot, unknown]
        visitor:
          type: integer
          description: 1 for the first visitor seen, 2 for the next; never an address

    TunnelVisits:
      type: object
      required: [available, requests]
      properties:
        available:
          type: boolean
          description: False when the tunnel service could not be asked just now
        requests:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/TunnelVisit"

    TunnelName:
      type: object
      required: [name, url, team, reservedBy, mine, password, live, usable, createdAt]
      properties:
        name:
          type: string
        url:
          type: ["string", "null"]
          description: The preview link the name gives
        team:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
          description: The team the name belongs to, when kept inside one
        reservedBy:
          oneOf:
            - type: object
              required: [id, email]
              properties:
                id:
                  type: string
                email:
                  type: string
            - type: "null"
        mine:
          type: boolean
        password:
          type: boolean
          description: Whether the name has a password
        live:
          type: boolean
          description: Whether a preview runs under it now
        usable:
          type: boolean
          description: |
            False when the plan no longer covers it (past the count after a downgrade, or a team
            whose subscription ended): kept, but nothing can be shared under it
        createdAt:
          type: string
          format: date-time

    TunnelTeamNameCount:
      type: object
      required: [id, name, active, limit, used]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
          description: False while the team has no subscription
        limit:
          type: integer
          description: The team plan's names per seat times its seats
        used:
          type: integer

    TunnelNameList:
      type: object
      required: [names, limit, used, plan, teams]
      properties:
        names:
          type: array
          items:
            $ref: "#/components/schemas/TunnelName"
        limit:
          type: integer
          description: Own names the plan allows
        used:
          type: integer
          description: Own names kept
        plan:
          type: string
          enum: [free, pro, business, team, team_business]
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TunnelTeamNameCount"

    TunnelPasswordResult:
      type: object
      required: [ok, password]
      properties:
        ok:
          type: boolean
        password:
          type: boolean
          description: Whether the name has a password now

    StreamRequest:
      type: object
      description: The data of a `request` event on the SSE stream.
      required:
        [_id, _creationTime, endpointId, method, path, headers, queryParams, ip, size, receivedAt]
      properties:
        _id:
          type: string
          description: The request ID, as `id` in Request
        _creationTime:
          type: integer
          description: Unix timestamp (ms), the same as `receivedAt`
        endpointId:
          type: string
        method:
          type: string
          description: HTTP method, or `EMAIL` for a captured email
        path:
          type: string
          description: Path after the slug, or the recipient address for a captured email
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        bodyRaw:
          type: string
          description: Base64 of the exact body bytes, present only when the body is not valid UTF-8
        queryParams:
          type: object
          additionalProperties:
            type: string
        contentType:
          type: string
        ip:
          type: string
        size:
          type: integer
        receivedAt:
          type: integer
          description: Unix timestamp (ms)
        kind:
          type: string
          enum: [http, email]
          description: "`email` for a captured email, `http` for everything else"

    EmailCapture:
      type: object
      description: |
        A captured email, parsed. Anything missing or malformed in the message is null or an empty
        list. Text and HTML parts are kept up to 256 KB each; attachment contents are not kept.
        See [Email capture](https://webhooks.cc/docs/email-capture).
      required:
        [
          subject,
          from,
          to,
          cc,
          replyTo,
          sender,
          date,
          messageId,
          inReplyTo,
          tag,
          text,
          html,
          textFromHtml,
          attachments,
          auth,
          smtp,
          parseError,
          truncated,
        ]
      properties:
        subject:
          type: ["string", "null"]
        from:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        replyTo:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        sender:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        date:
          type: ["string", "null"]
          format: date-time
          description: The message's Date header as RFC 3339, null when missing or invalid
        messageId:
          type: ["string", "null"]
        inReplyTo:
          type: array
          items:
            type: string
        tag:
          type: ["string", "null"]
          description: The `+tag` of the address the email was sent to, as the sender wrote it
        text:
          type: ["string", "null"]
          description: The text part
        html:
          type: ["string", "null"]
          description: The HTML part
        textFromHtml:
          type: boolean
          description: The message had no text part, so `text` was derived from the HTML
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttachment"
        auth:
          oneOf:
            - $ref: "#/components/schemas/EmailAuth"
            - type: "null"
          description: Sender checks run when the message arrived, null when there are none
        smtp:
          oneOf:
            - $ref: "#/components/schemas/EmailSmtp"
            - type: "null"
          description: The SMTP session the message arrived in
        parseError:
          type: boolean
          description: The message could not be parsed; the original is still in the request's `body`
        truncated:
          type: object
          required: [raw, text, html, headers, addresses, attachments]
          properties:
            raw:
              type: boolean
              description: The message was over 1 MB, so the request's `body` holds its headers only
            text:
              type: boolean
              description: The text part was cut at 256 KB
            html:
              type: boolean
              description: The HTML part was cut at 256 KB
            headers:
              type: boolean
              description: The header section was over 1 MB, so only its start was parsed and the body was skipped
            addresses:
              type: boolean
              description: An address list had more than 100 entries; the rest were dropped
            attachments:
              type: boolean
              description: The message had more than 100 attachments; only the first 100 are listed

    EmailExtracts:
      type: object
      required: [codes, links]
      description: |
        One-time codes and links found in an email. Codes are only taken when a word such as
        "code" or "verification" sits next to them, and come in the order they appear, the subject
        first. Links that look like what the email asks you to click (confirm, verify, reset, sign
        in) come first; unsubscribe, tracking and social links are left out.
      properties:
        codes:
          type: array
          maxItems: 20
          items:
            type: string
          description: Codes with spaces and dashes removed, such as `482913`
        links:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExtractedLink"

    ExtractedLink:
      type: object
      required: [url, label, action]
      properties:
        url:
          type: string
        label:
          type: ["string", "null"]
          description: The link text, when the link came from the HTML part
        action:
          type: boolean
          description: Looks like what the email asks you to click (confirm, verify, reset, sign in)

    EmailAddress:
      type: object
      required: [name, address]
      properties:
        name:
          type: ["string", "null"]
        address:
          type: ["string", "null"]

    EmailAttachment:
      type: object
      required: [filename, contentType, size, contentId, inline]
      properties:
        filename:
          type: ["string", "null"]
        contentType:
          type: string
        size:
          type: integer
          description: Size in bytes. The contents are not kept.
        contentId:
          type: ["string", "null"]
          description: Content-ID, for images the HTML references with `cid:`
        inline:
          type: boolean

    EmailCheck:
      type: object
      required: [result, domain]
      properties:
        result:
          type: string
          description: Verdict such as `pass`, `fail`, `softfail`, `neutral`, `none`, `temperror`, `permerror`
        domain:
          type: ["string", "null"]

    EmailAuth:
      type: object
      required: [spf, dkim, dmarc, iprev, authenticationResults, error]
      properties:
        spf:
          oneOf:
            - $ref: "#/components/schemas/EmailCheck"
            - type: "null"
        dkim:
          type: array
          description: One result per DKIM signature
          items:
            allOf:
              - $ref: "#/components/schemas/EmailCheck"
              - type: object
                required: [selector]
                properties:
                  selector:
                    type: ["string", "null"]
        dmarc:
          oneOf:
            - allOf:
                - $ref: "#/components/schemas/EmailCheck"
                - type: object
                  required: [policy, reason]
                  properties:
                    policy:
                      type: ["string", "null"]
                    reason:
                      type: ["string", "null"]
            - type: "null"
        iprev:
          oneOf:
            - type: object
              required: [result, ptr]
              properties:
                result:
                  type: string
                ptr:
                  type: ["string", "null"]
                  description: Host name the sending server's IP address points to
            - type: "null"
          description: Reverse DNS check of the sending server
        authenticationResults:
          type: ["string", "null"]
          description: The Authentication-Results header written when the message arrived
        error:
          type: ["string", "null"]
          description: Set when the checks could not run (`unavailable`, `timeout`, `busy`, `failed`)

    EmailSmtp:
      type: object
      required: [clientIp, clientRdns, helo, tls, envelopeFrom, envelopeTo, size, test]
      properties:
        clientIp:
          type: ["string", "null"]
        clientRdns:
          type: ["string", "null"]
        helo:
          type: ["string", "null"]
        tls:
          oneOf:
            - type: object
              required: [version, cipher]
              properties:
                version:
                  type: ["string", "null"]
                cipher:
                  type: ["string", "null"]
            - type: "null"
          description: The encrypted connection, null when the message arrived without TLS
        envelopeFrom:
          type: ["string", "null"]
          description: The SMTP envelope sender (MAIL FROM)
        envelopeTo:
          type: array
          items:
            type: string
          description: The SMTP envelope recipients (RCPT TO) that reached this endpoint
        size:
          type: ["integer", "null"]
          description: Size of the whole message as received, in bytes
        test:
          type: boolean
          description: True only for the dashboard's "Send test email" sample

    ForwardingSecret:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          description: |
            `whsec_` followed by the base64 signing key. Verify `webhook-signature` with the key
            (the base64 after the prefix), as the Standard Webhooks libraries do.

    ForwardTestResult:
      type: object
      description: |
        What a test delivery came back with. A file drop's test (`format: file_drop`) has
        `status: null`, `file` (the test file written), `ok` and, for SFTP, `hostKey`, and no
        `kind`, `target`, `url`, `request` or `sender`.
      required: [status, durationMs, excerpt, error, delivered, sample, format]
      properties:
        status:
          type: ["integer", "null"]
          description: Status your server answered, null when no answer arrived
        durationMs:
          type: integer
        excerpt:
          type: ["string", "null"]
          description: The start of your server's response body (up to 1 KB)
        error:
          type: ["string", "null"]
          description: Why no answer arrived (timeout, refused connection, TLS problem, blocked URL), null when one did
        delivered:
          type: boolean
          description: True when your server answered with a 2xx status
        sample:
          type: boolean
          description: True when the endpoint had no request of that kind yet, so a sample was sent
        kind:
          type: string
          enum: [http, email]
          description: The kind of request that was sent
        format:
          $ref: "#/components/schemas/DeliveryFormat"
        url:
          type: string
          description: The URL the delivery went to (with the request's path appended, for a relayed request)
        target:
          type: ["string", "null"]
          description: The destination's host and path (host only for Slack and Discord)
        filterPasses:
          type: boolean
          description: |
            Whether the destination's filter lets the request through. Only on a destination's own
            test; the test sends either way.
        request:
          type: object
          description: What was sent
          properties:
            id:
              type: ["string", "null"]
              description: Only on a destination's own test; null for a sample
            method:
              type: string
            path:
              type: string
            subject:
              type: ["string", "null"]
            receivedAt:
              type: integer
        sender:
          oneOf:
            - $ref: "#/components/schemas/SenderTime"
            - type: "null"
          description: The sender's own timestamp, when the request has one

    SenderTime:
      type: object
      required: [at, source, wholeSeconds]
      properties:
        at:
          type: integer
          description: Unix timestamp (ms)
        source:
          type: string
          description: Where it was read, the body field's name or the header
        wholeSeconds:
          type: boolean
          description: The timestamp has no fraction, so a lag under a second cannot be told

    DeliveryFormat:
      type: ["string", "null"]
      enum:
        [
          as_received,
          json,
          chat,
          template,
          postmark,
          sendgrid,
          mailgun,
          cloudmailin,
          sheets,
          file_drop,
          null,
        ]
      description: How a delivery went out, recorded with its first try

    DeliveryDestination:
      type: ["object", "null"]
      description: |
        Where a delivery went. Null for deliveries from before destinations existed, or once the
        destination is removed.
      required: [id, name, url]
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        url:
          type: string
          description: The destination's URL (only its scheme and host for team members)

    Delivery:
      type: object
      description: One forwarded copy of a request, with every try
      required:
        [
          id,
          requestId,
          kind,
          status,
          destination,
          attempts,
          createdAt,
          finishedAt,
          nextAttemptAt,
          lastStatus,
          lastError,
          format,
          target,
          senderAt,
          senderSource,
          attemptLog,
        ]
      properties:
        id:
          type: string
        requestId:
          type: string
        kind:
          type: string
          enum: [http, email]
        status:
          type: string
          enum: [pending, succeeded, failed, skipped]
          description: "`skipped`: the destination's filter turned the request down"
        destination:
          $ref: "#/components/schemas/DeliveryDestination"
        attempts:
          type: integer
          description: Tries made so far
        createdAt:
          type: integer
          description: Unix timestamp (ms) when the delivery was queued
        finishedAt:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when it succeeded or failed for good, null while pending
        nextAttemptAt:
          type: ["integer", "null"]
          description: Unix timestamp (ms) of the next try, for pending deliveries only
        lastStatus:
          type: ["integer", "null"]
          description: Status your server answered on the last try
        lastError:
          type: ["string", "null"]
          description: Why the last try failed, null after a success
        format:
          $ref: "#/components/schemas/DeliveryFormat"
        target:
          type: ["string", "null"]
          description: |
            Where it went: host and path, or the host only for Slack and Discord (whose path is a
            secret) and for team members
        senderAt:
          type: ["integer", "null"]
          description: The sender's own timestamp (ms), when the request had one
        senderSource:
          type: ["string", "null"]
          description: Where the sender's timestamp was read
        attemptLog:
          type: array
          description: Every try, newest first
          items:
            $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryAttempt:
      type: object
      required: [attemptedAt, status, durationMs, error, responseExcerpt]
      properties:
        attemptedAt:
          type: integer
          description: Unix timestamp (ms)
        status:
          type: ["integer", "null"]
          description: Status your server answered, null when no answer arrived
        durationMs:
          type: integer
        error:
          type: ["string", "null"]
          description: Why the try failed (including a non-2xx answer), null when it succeeded
        responseExcerpt:
          type: ["string", "null"]
          description: The start of your server's response body (up to 1 KB)

    RecentDelivery:
      type: object
      description: A row of an endpoint's delivery log
      required:
        [
          id,
          requestId,
          kind,
          status,
          destination,
          attempts,
          createdAt,
          finishedAt,
          lastStatus,
          lastError,
          lastDurationMs,
          subject,
          method,
          path,
          receivedAt,
          nextAttemptAt,
          format,
          senderAt,
          senderSource,
          cursor,
        ]
      properties:
        id:
          type: string
        requestId:
          type: string
        kind:
          type: string
          enum: [http, email]
        status:
          type: string
          enum: [pending, succeeded, failed, skipped]
        destination:
          $ref: "#/components/schemas/DeliveryDestination"
        attempts:
          type: integer
        createdAt:
          type: integer
          description: Unix timestamp (ms) when the delivery was queued
        finishedAt:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when it was delivered or given up, null while pending
        lastStatus:
          type: ["integer", "null"]
        lastError:
          type: ["string", "null"]
        lastDurationMs:
          type: ["integer", "null"]
          description: Your server's time on the latest try
        subject:
          type: ["string", "null"]
          description: Subject of a forwarded email
        method:
          type: ["string", "null"]
          description: The request's method (`EMAIL` for an email)
        path:
          type: ["string", "null"]
        receivedAt:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the request was captured
        nextAttemptAt:
          type: ["integer", "null"]
          description: Unix timestamp (ms) of the next try, for pending deliveries
        format:
          $ref: "#/components/schemas/DeliveryFormat"
        senderAt:
          type: ["integer", "null"]
        senderSource:
          type: ["string", "null"]
        cursor:
          type: string
          description: Where this row sits in the log; pass it as `before` for the rows after it

    DestinationFormat:
      type: string
      enum:
        [
          auto,
          as_received,
          json,
          chat,
          template,
          postmark,
          sendgrid,
          mailgun,
          cloudmailin,
          sheets,
          file_drop,
        ]
      description: |
        How deliveries go out. `auto` picks from the URL: a chat message for Slack and Discord
        webhooks, otherwise HTTP requests as received and emails as signed JSON. `as_received`
        relays an HTTP request with its own method, headers and bytes plus signed `webhooks-cc-*`
        headers (emails go as signed JSON). `json` is signed JSON for either kind. `template` is
        your own JSON body (`bodyTemplate`), signed like `json`. `chat` is a Slack or Discord
        message (`messageTemplate`). `postmark`, `sendgrid`, `mailgun` and `cloudmailin` send an
        email in that inbound mail provider's shape. `sheets` appends rows to a Google Sheet and
        `file_drop` (Business) writes files to SFTP, FTP/FTPS or S3-compatible storage; both keep
        their settings in `config`.

    DestinationFilter:
      type: ["object", "null"]
      description: Which captures the destination receives; null sends every capture of its kinds.
      required: [conditions]
      properties:
        logic:
          type: string
          enum: [and, or]
          default: and
        conditions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Condition"

    DestinationHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: ["string", "null"]
          description: |
            Read: the value, masked. Write: the value, or null to keep the value stored under that
            name.

    Destination:
      type: object
      description: One place an endpoint's captures go.
      required:
        [
          id,
          endpointId,
          position,
          name,
          enabled,
          url,
          hasSecret,
          http,
          email,
          format,
          filter,
          headers,
          appendPath,
          retrySeconds,
          keepOrder,
          sentField,
          throttleSeconds,
          delaySeconds,
          attachments,
          config,
          role,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
        position:
          type: integer
          description: Its place in the order, from 0
        name:
          type: ["string", "null"]
        enabled:
          type: boolean
        url:
          type: string
          description: |
            Where deliveries go. For a Google Sheets destination the spreadsheet's address, for a
            file drop its address (`sftp://host/folder`, `s3://bucket/prefix (host)`).
        hasSecret:
          type: boolean
          description: Whether a signing secret exists; read it at `/destinations/{id}/secret`
        hasMailgunSigningKey:
          type: boolean
        hasDropSecret:
          type: boolean
          description: Whether a file drop's password, private key or secret key is saved
        http:
          type: boolean
          description: Receives HTTP requests
        email:
          type: boolean
          description: Receives emails
        format:
          $ref: "#/components/schemas/DestinationFormat"
        filter:
          $ref: "#/components/schemas/DestinationFilter"
        bodyTemplate:
          description: "For `template`: any JSON value, with `{{ placeholders }}` in its strings; null otherwise"
        messageTemplate:
          type: ["string", "null"]
          description: "For `chat`: the message's text; null keeps the standard message"
        headers:
          type: array
          description: Your own headers, values masked
          items:
            $ref: "#/components/schemas/DestinationHeader"
        appendPath:
          type: boolean
          description: Add the path after the slug to the URL, for requests relayed as received
        retrySeconds:
          type: integer
          enum: [0, 3600, 86400]
          description: How long a failed delivery is retried; 0 is a single try
        keepOrder:
          type: boolean
          description: One delivery at a time, in capture order
        sentField:
          type: ["string", "null"]
          description: The JSON body field holding the sender's own timestamp (dots for nesting)
        throttleSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: At most one delivery every this many seconds; captures in between are not sent
        delaySeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Wait this long before the first try; for a batched file drop, the batch window
        attachments:
          type: string
          enum: [links, inline, none]
          description: How an email's stored attachments travel in JSON, as signed links, inline base64, or not at all
        config:
          description: |
            Settings of the formats that are not a URL, null otherwise: a `SheetsConfig` for
            `sheets`, a `FileDropConfig` for `file_drop`.
          oneOf:
            - $ref: "#/components/schemas/SheetsConfig"
            - $ref: "#/components/schemas/FileDropConfig"
            - type: "null"
        role:
          type: ["string", "null"]
          enum: [forward, notify, null]
          description: |
            Which older endpoint field this destination stands for: `forward` is the primary
            destination (`forwardUrl` and the other `forward*` fields), `notify` the endpoint's
            `notificationUrl`.
        createdAt:
          type: integer
          description: Unix timestamp (ms)
        updatedAt:
          type: integer
          description: Unix timestamp (ms)
        summary:
          type: object
          description: Only with `?summary=true` on the list
          properties:
            last24h:
              type: object
              properties:
                delivered:
                  type: integer
                failed:
                  type: integer
                skipped:
                  type: integer
            pending:
              type: integer

    DestinationInput:
      type: object
      description: |
        A destination to add (`url` required, except for a file drop) or the fields of one to
        change. At least one of `http` and `email` must stay on.
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            `https` on a public host name: no IP addresses, `localhost`, credentials in the URL or
            blocked ports, and not webhooks.cc's own capture host. Not used by `sheets` and
            `file_drop`, whose address comes from `config`.
        name:
          type: ["string", "null"]
          maxLength: 100
        enabled:
          type: boolean
          default: true
        http:
          type: boolean
          default: true
        email:
          type: boolean
          default: true
        position:
          type: integer
          minimum: 0
        format:
          allOf:
            - $ref: "#/components/schemas/DestinationFormat"
          default: auto
        filter:
          $ref: "#/components/schemas/DestinationFilter"
        bodyTemplate:
          description: |
            Required for `template`: any JSON value of at most 64 KB as text. Strings may hold
            `{{ path | filter }}` placeholders of what the destination receives; an unknown first
            key is refused.
        messageTemplate:
          type: ["string", "null"]
          maxLength: 4000
        mailgunSigningKey:
          type: ["string", "null"]
          maxLength: 200
          description: "For `mailgun`: signs the form the way Mailgun does. Write only."
        headers:
          type: array
          maxItems: 10
          description: The whole list of your headers; `[]` removes them all
          items:
            $ref: "#/components/schemas/DestinationHeader"
        appendPath:
          type: boolean
          default: true
        retrySeconds:
          type: integer
          enum: [0, 3600, 86400]
          default: 86400
        keepOrder:
          type: boolean
          default: false
        sentField:
          type: ["string", "null"]
          maxLength: 128
        throttleSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        delaySeconds:
          type: integer
          minimum: 0
          maximum: 3600
        attachments:
          type: string
          enum: [links, inline, none]
        config:
          description: "For `sheets` a `SheetsConfig`, for `file_drop` a `FileDropConfig`"
          oneOf:
            - $ref: "#/components/schemas/SheetsConfig"
            - $ref: "#/components/schemas/FileDropConfig"
            - type: "null"
        dropSecret:
          type: ["object", "null"]
          description: |
            For `file_drop` only, write only, stored encrypted: `password` (FTP, FTPS, SFTP),
            `privateKey` (SFTP, OpenSSH or PEM) or `secretAccessKey` (S3). Asked for again whenever
            the drop's server, login, bucket, pinned host key or certificate fingerprint changes.
          properties:
            password:
              type: string
            privateKey:
              type: string
            secretAccessKey:
              type: string

    SheetsConfig:
      type: object
      description: |
        A Google Sheets destination's settings. The spreadsheet is picked in the dashboard, with
        Google's file picker; `connectionId` is one of `GET /api/integrations/google/connections`.
      required: [connectionId, spreadsheetId, columns]
      properties:
        connectionId:
          type: string
          format: uuid
        spreadsheetId:
          type: string
        sheet:
          type: string
          maxLength: 100
          default: Sheet1
          description: The tab rows go to
        rows:
          type: string
          enum: [email, line_items]
          default: email
          description: A row per request, or a row per line item of an email's layout
        columns:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DropColumn"

    DropColumn:
      type: object
      required: [header, value]
      properties:
        header:
          type: string
          maxLength: 200
        value:
          type: string
          maxLength: 1000
          description: "Text with placeholders, such as `{{ parsed.fields.order }}` or `{{ item.sku }}`"

    FileDropConfig:
      type: object
      description: |
        A file drop's settings (Business, and Team Business for endpoints shared with the team):
        where the files go and what they hold. The secret is never part of it; send it as
        `dropSecret`. Connections come from `mx.mailhooks.cc`. See
        https://webhooks.cc/docs/forwarding#file-drops.
      required: [protocol]
      properties:
        protocol:
          type: string
          enum: [sftp, ftp, ftps, s3]
        host:
          type: ["string", "null"]
          description: "SFTP, FTP and FTPS: the server's public host name"
        port:
          type: ["integer", "null"]
          description: "Default: 22 for SFTP, 21 for FTP and FTPS"
        username:
          type: ["string", "null"]
        folder:
          type: string
          description: |
            The folder files go to (SFTP and FTP: it must exist, relative to the login's home
            folder) or the key prefix (S3). Empty is the home folder or the bucket's root.
        hostKey:
          type: ["string", "null"]
          description: "SFTP: the server's host key fingerprint (`SHA256:...`), pinned on the first connection"
        tlsFingerprint:
          type: ["string", "null"]
          description: "FTPS and S3: a self-signed certificate's SHA-256 fingerprint, then the only one accepted"
        endpoint:
          type: ["string", "null"]
          description: "S3: the storage endpoint's URL"
        region:
          type: ["string", "null"]
          description: "S3; default `us-east-1`"
        bucket:
          type: ["string", "null"]
        accessKeyId:
          type: ["string", "null"]
        file:
          type: string
          enum: [csv, json, xml]
          default: csv
          description: |
            CSV or XML with your `columns`, or JSON with each request as the signed JSON format
            sends it
        rows:
          type: string
          enum: [email, line_items]
          default: email
        columns:
          type: array
          maxItems: 50
          description: CSV and XML only
          items:
            $ref: "#/components/schemas/DropColumn"
        prefix:
          type: string
          maxLength: 60
          description: Put before each file's name
        batch:
          type: boolean
          default: false
          description: |
            One file for everything that arrives within the destination's `delaySeconds` of a
            batch's first request, instead of a file per request

    DestinationPreview:
      type: object
      required: [request, takesKind, filterPasses, format, delivery, error]
      properties:
        request:
          type: object
          description: The request the preview ran on
          properties:
            id:
              type: ["string", "null"]
              description: Null for a sample
            kind:
              type: string
              enum: [http, email]
            method:
              type: string
            path:
              type: string
            subject:
              type: ["string", "null"]
            receivedAt:
              type: integer
            sample:
              type: boolean
        takesKind:
          type: boolean
          description: Whether the destination receives requests of this kind
        filterPasses:
          type: boolean
        format:
          $ref: "#/components/schemas/DeliveryFormat"
        delivery:
          type: ["object", "null"]
          description: The request it would send; null when it cannot be built (see `error`)
          properties:
            method:
              type: string
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: ["string", "null"]
              description: The body as text when it is UTF-8
            bodyBase64:
              type: ["string", "null"]
              description: The body as base64 when it is not UTF-8
        error:
          type: ["string", "null"]
          description: Why the delivery cannot be built, null when it can

    SearchResult:
      type: object
      required: [id, slug, method, path, headers, queryParams, ip, size, receivedAt]
      properties:
        id:
          type: string
          description: The request's ID (usable with the request routes, such as GET /api/requests/{id})
        slug:
          type: string
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        queryParams:
          type: object
          additionalProperties:
            type: string
        contentType:
          type: string
        ip:
          type: string
        size:
          type: integer
        receivedAt:
          type: integer
        bodyRaw:
          type: string
          description: Base64 of the exact body bytes, present only when the body is not valid UTF-8
        kind:
          type: string
          enum: [http, email]
          description: "`email` for a captured email, `http` for everything else"
        email:
          oneOf:
            - $ref: "#/components/schemas/EmailCapture"
            - type: "null"
          description: The parsed message when `kind` is `email`, null otherwise

    PaginatedRequests:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        cursor:
          type: string
          description: Opaque cursor for the next page
        hasMore:
          type: boolean
          description: Whether another page is available

    UsageInfo:
      type: object
      required: [used, limit, remaining, plan, periodEnd]
      properties:
        used:
          type: integer
          description: Requests used of the period's allowance (limit)
        limit:
          type: integer
          description: The period's allowance, the plan's requests plus monthly blocks
        remaining:
          type: integer
          description: >-
            Requests still accepted this period: what is left of limit, plus one-time blocks,
            plus overage up to its maximum
        blockRequests:
          type: integer
          description: Requests monthly blocks add to limit this period
        creditRequests:
          type: integer
          description: One-time blocks left, in requests, used once the allowance is gone
        overage:
          type: object
          required: [active, used, max]
          properties:
            active:
              type: boolean
              description: Whether overage is counting (a live overage subscription on a paid plan)
            used:
              type: integer
              description: Overage requests counted this period
            max:
              type: integer
              description: The customer's overage maximum per period, in requests
        plan:
          type: string
          enum: [free, pro, business]
        periodEnd:
          type: ["integer", "null"]
          description: Unix timestamp (ms) for the quota period's end, null if the period has not started
        teamBilledEndpoints:
          type: integer
          description: |
            How many of your endpoints are shared with a subscribed team and bill its pooled quota
            instead of yours
        emails:
          type: integer
          description: How many of `used` were emails
        quotaRejections:
          type: object
          description: |
            Webhooks refused with 429 this period because the quota was used up, by endpoint.
            Empty while there is quota left.
          properties:
            total:
              type: integer
            endpointCount:
              type: integer
            endpoints:
              type: array
              description: The most rejected endpoints, most rejected first
              items:
                type: object
                properties:
                  slug:
                    type: string
                  rejected:
                    type: integer
        parsedPages:
          type: ["object", "null"]
          description: |
            Attachment pages parsed by layouts in the account's page window. Null when it could
            not be read.
          required: [used, limit, creditPages, overage, resetsAt]
          properties:
            used:
              type: integer
            limit:
              type: integer
              description: The window's pages, the plan's plus monthly page blocks
            creditPages:
              type: integer
              description: One-time pages left, used once limit is gone
            overage:
              type: object
              required: [active, used, max]
              properties:
                active:
                  type: boolean
                used:
                  type: integer
                max:
                  type: integer
            resetsAt:
              type: ["string", "null"]
              format: date-time
              description: When the window ends, null until a monthly window's first parse
        previewData:
          type: ["object", "null"]
          description: |
            What visitors downloaded from `whk share` previews this UTC month. Null where sharing
            is not offered.
          required: [bytes, limitBytes, over, resetsAt]
          properties:
            bytes:
              type: integer
            limitBytes:
              type: integer
            over:
              type: boolean
              description: Past the allowance, previews are paused until resetsAt
            resetsAt:
              type: string
              format: date-time
        aiAssists:
          type: ["object", "null"]
          description: |
            AI assists used over the rolling 30 days on endpoints no team pays for. Null where AI
            assists are not offered.
          required: [used, allowed, nextAt]
          properties:
            used:
              type: integer
            allowed:
              type: integer
            nextAt:
              type: ["string", "null"]
              format: date-time
              description: When the next counted assist stops counting, null when none is counted

    TeamShare:
      type: object
      required: [teamId, teamName]
      properties:
        teamId:
          type: string
        teamName:
          type: string

    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        createdBy:
          type: string
          description: User ID of the team's owner
        createdAt:
          type: integer
          description: Unix timestamp (ms)
        suspended:
          type: boolean
          description: True while the team has no subscription; it cannot invite or share until it has one
        subscriptionStatus:
          type: ["string", "null"]
          enum: [active, canceled, past_due, null]
        business:
          type: boolean
          description: The team is on Team Business
        billingInterval:
          type: ["string", "null"]
          enum: [month, year, null]
        seats:
          type: integer
        requestsUsed:
          type: integer
          description: Requests used of the team's pooled quota this period
        requestLimit:
          type: integer
          description: The pooled quota this period
        blockRequests:
          type: integer
          description: Requests monthly blocks add to requestLimit this period
        periodEnd:
          type: ["integer", "null"]
          description: Unix timestamp (ms) for the quota period's end
        billingPeriodEnd:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the subscription renews
        cancelAtPeriodEnd:
          type: boolean
        pendingSeats:
          type: ["integer", "null"]
          description: The seat count a scheduled reduction applies at the next renewal
        pendingPlan:
          type: ["string", "null"]
          enum: [team, team_business, null]
        pendingInterval:
          type: ["string", "null"]
          enum: [month, year, null]

    TeamMember:
      type: object
      properties:
        id:
          type: string
          description: Membership ID
        userId:
          type: string
        email:
          type: string
        name:
          type: [string, "null"]
        image:
          type: [string, "null"]
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: integer

    TeamInvite:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        teamName:
          type: string
        invitedEmail:
          type: string
          description: Email address of the invited user
        invitedBy:
          type: string
          description: User ID of the person who sent the invite
        inviterEmail:
          type: string
          description: Email address of the person who sent the invite
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: integer

    TeamSharedEndpoint:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: [string, "null"]
        ownerId:
          type: string
        ownerName:
          type: [string, "null"]
        ownerEmail:
          type: string
        sharedBy:
          type: string
          description: User ID of the member who shared the endpoint
        sharedAt:
          type: integer
          description: Share time in milliseconds since the epoch
        requestCount:
          type: integer

    # -- Agents ----------------------------------------------------------------

    AgentError:
      type: object
      required: [error, error_description]
      description: |
        Error envelope of the agent routes, with auth.md's codes. Some errors carry extra members
        (a fresh proof-of-work challenge, `max_age`, a claim block).
      properties:
        error:
          type: string
          description: Machine-readable error code
        error_description:
          type: string
          description: Human-readable explanation and what to do next
      additionalProperties: true

    PowChallenge:
      type: object
      required: [challenge, algorithm, difficulty, count, expires_at]
      properties:
        challenge:
          type: string
          description: Opaque, signed challenge string (`pow1.<payload>.<mac>`). Send it back unchanged.
        algorithm:
          type: string
          const: sha256-zero-bits
        difficulty:
          type: integer
          description: Leading zero bits each hash must have
        count:
          type: integer
          description: Number of sub-puzzles, and of nonces to send
        expires_at:
          type: string
          format: date-time
          description: The challenge is refused after this time

    ProofOfWorkSolution:
      type: object
      required: [challenge, nonces]
      properties:
        challenge:
          type: string
          description: The challenge string, unchanged
        nonces:
          type: array
          description: One decimal nonce per sub-puzzle, in order (`count` items)
          items:
            type: string
            pattern: "^[0-9]{1,16}$"

    ProofOfWorkRequiredError:
      description: |
        `proof_of_work_required` or `invalid_challenge`: the error plus a fresh challenge to solve
      allOf:
        - $ref: "#/components/schemas/AgentError"
        - $ref: "#/components/schemas/PowChallenge"
        - type: object
          properties:
            challenge_endpoint:
              type: string
              format: uri
              description: Where to fetch further challenges

    AnonymousRegistrationRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: anonymous
        client_name:
          type: string
          maxLength: 64
          description: Self-reported agent name, shown to humans labelled as self-reported
        proof_of_work:
          $ref: "#/components/schemas/ProofOfWorkSolution"

    ServiceAuthRegistrationRequest:
      type: object
      required: [type, login_hint]
      properties:
        type:
          type: string
          const: service_auth
        login_hint:
          type: string
          format: email
          description: |
            Email address of the human who will claim the agent. Addresses at the capture domain
            (`mailhooks.cc`) are refused.
        client_name:
          type: string
          maxLength: 64
          description: Self-reported agent name, shown to humans labelled as self-reported

    IdJagRegistrationRequest:
      type: object
      required: [type, assertion_type, assertion]
      properties:
        type:
          type: string
          const: identity_assertion
        assertion_type:
          type: string
          const: urn:ietf:params:oauth:token-type:id-jag
        assertion:
          type: string
          description: The ID-JAG issued by a trusted identity provider

    ClaimAttemptBlock:
      type: object
      required: [user_code, expires_in, verification_uri, interval]
      description: What the agent shows its human (RFC 8628 shape)
      properties:
        user_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Six-digit code the human types on the claim page
        expires_in:
          type: integer
          description: Seconds until the code expires (15 minutes when issued)
        verification_uri:
          type: string
          format: uri
          description: Claim page the human opens while signed in
        interval:
          type: integer
          description: Seconds to wait between polls of the claim grant

    AnonymousRegistration:
      type: object
      required:
        - registration_id
        - registration_type
        - identity_assertion
        - assertion_expires
        - pre_claim_scopes
        - claim_url
        - claim_token
        - claim_token_expires
        - post_claim_scopes
        - sandbox
      properties:
        registration_id:
          type: string
        registration_type:
          type: string
          const: anonymous
        identity_assertion:
          type: string
          description: Signed assertion to exchange at the token endpoint (jwt-bearer grant)
        assertion_expires:
          type: string
          format: date-time
        pre_claim_scopes:
          type: array
          items:
            type: string
          description: "`[webhooks:sandbox]`"
        claim_url:
          type: string
          format: uri
          description: "`POST` here with the claim token to start a claim"
        claim_token:
          type: string
          description: "`clm_...`. Keep it secret; it starts claims and collects the claimed credentials."
        claim_token_expires:
          type: string
          format: date-time
        post_claim_scopes:
          type: array
          items:
            type: string
          description: "`[webhooks:read, webhooks:write]`"
        sandbox:
          type: object
          required:
            - status
            - endpoints_url
            - lifetime_seconds
            - max_endpoints
            - max_requests_per_endpoint
            - max_requests
          properties:
            status:
              type: string
              enum: [available, full]
            endpoints_url:
              type: string
              format: uri
            lifetime_seconds:
              type: integer
            max_endpoints:
              type: integer
            max_requests_per_endpoint:
              type: integer
            max_requests:
              type: integer
        id:
          type: string
          description: Same as `registration_id` (auth.md v0.7 proposal shape)
        type:
          type: string
          const: anonymous
          description: Same as `registration_type` (auth.md v0.7 proposal shape)
        identity:
          type: object
          description: The assertion again, in the auth.md v0.7 proposal shape
          properties:
            assertion:
              type: string
            expires_at:
              type: string
              format: date-time
        claim:
          type: object
          description: The claim token again, in the auth.md v0.7 proposal shape
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
            url:
              type: string
              format: uri
        scopes:
          type: object
          description: The scopes again, in the auth.md v0.7 proposal shape
          properties:
            pre_claim:
              type: array
              items:
                type: string
            post_claim:
              type: array
              items:
                type: string

    ServiceAuthRegistration:
      type: object
      required:
        - registration_id
        - registration_type
        - claim_url
        - claim_token
        - claim_token_expires
        - post_claim_scopes
        - claim
      properties:
        registration_id:
          type: string
        registration_type:
          type: string
          const: service_auth
        claim_url:
          type: string
          format: uri
        claim_token:
          type: string
          description: "`clm_...`. Poll the claim grant with it."
        claim_token_expires:
          type: string
          format: date-time
        post_claim_scopes:
          type: array
          items:
            type: string
        claim:
          $ref: "#/components/schemas/ClaimAttemptBlock"

    IdJagRegistration:
      type: object
      required: [registration_id, registration_type, identity_assertion, assertion_expires, scopes]
      properties:
        registration_id:
          type: string
        registration_type:
          type: string
          const: identity_assertion
        identity_assertion:
          type: string
          description: Assertion to exchange at the token endpoint (jwt-bearer grant)
        assertion_expires:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string

    IdJagInteractionRequired:
      description: |
        `interaction_required`: the claim ceremony runs first. Show the human the `claim` block,
        then poll the claim grant with `claim_token`.
      allOf:
        - $ref: "#/components/schemas/AgentError"
        - type: object
          required:
            - registration_id
            - registration_type
            - claim_url
            - claim_token
            - claim_token_expires
            - post_claim_scopes
            - claim
          properties:
            registration_id:
              type: string
            registration_type:
              type: string
              const: identity_assertion
            claim_url:
              type: string
              format: uri
            claim_token:
              type: string
              description: "`clm_...`. Poll the claim grant with it."
            claim_token_expires:
              type: string
              format: date-time
            post_claim_scopes:
              type: array
              items:
                type: string
            claim:
              $ref: "#/components/schemas/ClaimAttemptBlock"

    ClaimAttemptStarted:
      type: object
      required: [registration_id, claim_attempt_id, status, expires_at, claim_attempt]
      properties:
        registration_id:
          type: string
        claim_attempt_id:
          type: string
          description: "`cla_...`"
        status:
          type: string
          const: initiated
        expires_at:
          type: string
          format: date-time
          description: When the code expires
        claim_attempt:
          $ref: "#/components/schemas/ClaimAttemptBlock"

    SandboxLimits:
      type: object
      required: [expiresAt, maxEndpoints, requestLimit, budget]
      properties:
        expiresAt:
          type: integer
          description: Unix timestamp (ms) when the registration and its sandbox expire
        maxEndpoints:
          type: integer
          description: Live endpoints a registration may hold
        requestLimit:
          type: integer
          description: Captures per endpoint
        budget:
          type: object
          required: [used, limit]
          description: Captures across all of the registration's endpoints
          properties:
            used:
              type: integer
            limit:
              type: integer

    SandboxEndpoint:
      allOf:
        - $ref: "#/components/schemas/Endpoint"
        - type: object
          required: [requestCount, sandbox]
          properties:
            requestCount:
              type: integer
              description: Captures so far
            sandbox:
              $ref: "#/components/schemas/SandboxLimits"

    # -- OAuth -----------------------------------------------------------------

    OAuthError:
      type: object
      required: [error]
      description: RFC 6749 section 5.2 error envelope (also used by RFC 7009 and RFC 7591)
      properties:
        error:
          type: string
          description: Error code, for example `invalid_grant`
        error_description:
          type: string
          description: Human-readable explanation

    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, code_verifier, redirect_uri, client_id]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
          description: The code from the authorization response
        code_verifier:
          type: string
          description: The PKCE verifier whose S256 hash was sent as `code_challenge`
        redirect_uri:
          type: string
          format: uri
          description: The same `redirect_uri` as in the authorization request
        client_id:
          type: string
          description: Client ID Metadata Document URL or a dynamically registered id
        resource:
          type: string
          format: uri
          description: RFC 8707 resource indicator, for example `https://webhooks.cc/mcp`

    RefreshTokenGrant:
      type: object
      required: [grant_type, refresh_token, client_id]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
          description: The current refresh token. It stops working once this request succeeds.
        client_id:
          type: string
          description: The client the refresh token was issued to
        resource:
          type: string
          format: uri
          description: RFC 8707 resource indicator

    JwtBearerGrant:
      type: object
      required: [grant_type, assertion]
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:jwt-bearer
        assertion:
          type: string
          description: The identity assertion from agent registration or from the claim grant
        resource:
          type: string
          enum: [https://webhooks.cc/api/, https://webhooks.cc/mcp]
          description: |
            RFC 8707 resource indicator. Optional; the token is the same for both. Any other
            value answers `invalid_target`.

    ClaimGrant:
      type: object
      required: [grant_type, claim_token]
      properties:
        grant_type:
          type: string
          const: urn:workos:agent-auth:grant-type:claim
        claim_token:
          type: string
          pattern: "^clm_"
          maxLength: 64
          description: The claim token from agent registration

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: "`whcc_...` bearer token"
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires
        scope:
          type: string
          description: Space-separated scopes, for example `webhooks:read webhooks:write`
        refresh_token:
          type: string
          description: |
            Present for the `authorization_code` and `refresh_token` grants. Use it once; the next
            refresh returns a new one.
        identity_assertion:
          type: string
          description: |
            Claim grant only: the claimed identity assertion. Exchange it with the jwt-bearer grant
            for new access tokens until `assertion_expires`.
        assertion_expires:
          type: string
          format: date-time
          description: Claim grant only

    OAuthClientMetadata:
      type: object
      required: [redirect_uris]
      properties:
        client_name:
          type: string
          description: Name shown to the user on the consent screen
        redirect_uris:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          maxItems: 10
          description: |
            Redirect URIs, absolute and without a fragment or credentials: https (not on
            webhooks.cc's own hosts), http on a loopback host (`http://127.0.0.1/...`,
            `http://localhost/...`; any port matches, RFC 8252), or an app's own scheme
            (`cursor:`, `vscode:`, `vscode-insiders:`, `vscodium:`, `windsurf:`, `claude:`,
            `zed:`, `kiro:`, or a reverse-domain scheme such as `com.example.app:`).
        client_uri:
          type: string
          format: uri
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          items:
            type: string
            enum: [code]
        token_endpoint_auth_method:
          type: string
          description: Ignored on input; the client is always registered as `none`.
        application_type:
          type: string
          description: Echoed back when given (`web` or `native`)

    OAuthClient:
      description: The registered metadata, echoed, with the issued `client_id`
      allOf:
        - $ref: "#/components/schemas/OAuthClientMetadata"
        - type: object
          required: [client_id, client_id_issued_at]
          properties:
            client_id:
              type: string
            client_id_issued_at:
              type: integer
              description: Unix timestamp (seconds) when the id was issued

  responses:
    ApprovalAsked:
      description: >-
        Asked by an API key or agent token: the account's owner approves it at `url` (the page
        shows `code` to compare); poll `GET /api/approvals/{id}`.
      content:
        application/json:
          schema:
            type: object
            required: [approval]
            properties:
              approval:
                $ref: "#/components/schemas/Approval"

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FavoriteResult:
      description: Whether the endpoint is now one of the caller's favourites
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            type: object
            required: [favorite]
            properties:
              favorite:
                type: boolean
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the rate limit window resets
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SharingUnavailable:
      description: "Sharing is not set up on this server: `Sharing is not available here.`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # Rate-limit-aware error responses (for rate-limited operations)
    BadRequestRateLimited:
      description: Validation error
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnauthorizedRateLimited:
      description: Invalid or missing API key
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalErrorRateLimited:
      description: Server error
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    # Agent and OAuth error responses (`{ error, error_description }`)
    AgentRateLimited:
      description: "`rate_limited`: wait for `Retry-After` seconds"
      headers:
        Retry-After:
          description: Seconds until the rate limit window resets
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"

    AgentServerError:
      description: "`server_error`: retry later"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"

    AgentUnavailable:
      description: |
        `temporarily_unavailable`: registration is not available right now (not configured, or
        too many unclaimed registrations are live). Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"

    SandboxForbidden:
      description: |
        `sandbox_only`: the token is not the access token of an anonymous agent registration (API
        keys and account tokens use `/api/endpoints`). `sandbox_closed`: the registration was
        claimed, revoked or has expired; a claimed agent uses the normal API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"

    SandboxNotFound:
      description: "`not_found`: not an endpoint or request of this registration's sandbox"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"

    OAuthRateLimited:
      description: "`rate_limited`: wait for `Retry-After` seconds"
      headers:
        Retry-After:
          description: Seconds until the rate limit window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

    OAuthServerError:
      description: "`server_error`: retry later"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
