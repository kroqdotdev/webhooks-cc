[package]
name = "webhooks-receiver"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
# Errors and log lines to StatOSS. ureq sends from a thread of its own, and
# keeps a second reqwest major out of the build.
statoss = { version = "0.1", default-features = false, features = ["ureq", "tracing"] }
bytes = "1"
http = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# Response rule patterns; linear time in the input, so a pattern cannot stall a capture.
regex = "1"
uuid = { version = "1", features = ["v4"] }
# Signature verification
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
subtle = "2"
# AES-256-GCM (signing secrets), Ed25519, RSA and HMAC-SHA1; already in the
# build through rustls.
ring = "0.17"
crc32fast = "1"
mail-parser = "1.0.1"

[dev-dependencies]
# Drives the mail router in its tests (mail/handlers.rs).
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
