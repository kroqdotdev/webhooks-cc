[package]
name = "webhooks-receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tower = "0.5"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-rustls", "metrics"] }
tracing-opentelemetry = "0.33"
bytes = "1"
http = "1"
http-body-util = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "1.2", features = ["tokio-comp", "aio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
regex-lite = "0.1"
gethostname = "1.1.0"
# Signature verification
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
base64 = "0.23"
ed25519-dalek = { version = "2", features = ["std"] }
constant_time_eq = "0.5"
ring = "0.17"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
