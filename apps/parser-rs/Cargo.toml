[package]
name = "webhooks-parser"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "webhooks_parser"
path = "src/lib.rs"

[[bin]]
name = "webhooks-parser"
path = "src/main.rs"

[dependencies]
calamine = "0.37"
cfb = "0.15"
codepage = "0.1.3"
csv = "1.4"
encoding_rs = "0.8.42"
libc = "0.2"
lopdf = { version = "0.46", default-features = false }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
flate2 = "1.1"
rust_xlsxwriter = "0.102"

# The tests push multi-megabyte files through calamine, lopdf and flate2.
# Optimising the dependencies keeps them in seconds; this crate itself still
# builds unoptimised, so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
