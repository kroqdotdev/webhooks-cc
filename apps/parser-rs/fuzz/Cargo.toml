[package]
name = "webhooks-parser-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.webhooks-parser]
path = ".."

# Keeps the fuzz crate out of any workspace above it, as cargo-fuzz does.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spreadsheet"
path = "fuzz_targets/spreadsheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false
