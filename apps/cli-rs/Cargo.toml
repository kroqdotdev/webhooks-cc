[package]
name = "whk"
version = "0.1.0"
edition = "2024"
description = "The webhooks.cc CLI: capture, inspect, forward and replay webhooks and email, share localhost, for people and coding agents"
license = "MIT"
repository = "https://github.com/kroqdotdev/webhooks-cc"

[[bin]]
name = "whk"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"

# Terminal width for wrapped output
crossterm = "0.29"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Sharing (`whk share`, `whk tunnel --live`): the tunnel protocol shared
# with the edge, over a WebSocket on rustls (ring, as reqwest uses).
whk-tunnel = { path = "../../crates/tunnel" }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
yamux = "0.14"
gethostname = "1"
rpassword = "7"
qrcode = { version = "0.14", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
base64 = "0.23"
dirs = "7"
open = "5"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
flate2 = "1"
tar = "0.4"
unicode-width = "0.2"
urlencoding = "2"

[dev-dependencies]
axum = "0.8"
rqrr = "0.11"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
codegen-units = 1
