[package]
name = "whk-tunnel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The webhooks.cc tunnel protocol, shared by the edge (apps/edge-rs) and the CLI (apps/cli-rs)"

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["compat", "io"] }
yamux = "0.14.1"

[dev-dependencies]
# Paused time, for the splice tests.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
