[project]
name = "webhooks-cc"
version = "0.1.2"
description = "Python SDK for webhooks.cc: capture, wait for, sign and verify webhooks and test emails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "webhooks.cc" }]
keywords = ["webhooks", "testing", "stripe", "github", "signature", "email", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# Discord (Ed25519) and PayPal (RSA) signatures need public-key crypto.
crypto = ["cryptography>=42"]

[project.urls]
Homepage = "https://webhooks.cc"
Documentation = "https://github.com/kroqdotdev/webhooks-cc/tree/main/packages/sdk-python#readme"
Repository = "https://github.com/kroqdotdev/webhooks-cc"

[project.entry-points.pytest11]
webhooks_cc = "webhooks_cc.pytest_plugin"

[dependency-groups]
dev = [
  "cryptography>=42",
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooks_cc"]

[tool.hatch.build.targets.sdist]
# The tests read packages/sdk/conformance, which only the repository has.
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
