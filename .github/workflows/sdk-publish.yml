name: SDK Publish

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm --filter @webhooks-cc/sdk typecheck

      - name: Build SDK
        run: pnpm --filter @webhooks-cc/sdk build

      - name: Run tests
        run: pnpm --filter @webhooks-cc/sdk test

      # Write the token literally into ~/.npmrc — pnpm 10 does not reliably
      # interpolate ${NODE_AUTH_TOKEN} from the .npmrc generated by setup-node,
      # which silently sends unauthenticated requests and returns a 404 on PUT.
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm --filter @webhooks-cc/sdk publish --access public --no-git-checks
