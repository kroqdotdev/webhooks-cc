name: MCP Publish

on:
  push:
    tags:
      - "mcp-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub OIDC proves the io.github.kroqdotdev namespace to the MCP Registry.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK (dependency)
        run: pnpm --filter @webhooks-cc/sdk build

      - name: Typecheck
        run: pnpm --filter @webhooks-cc/mcp typecheck

      - name: Build MCP
        run: pnpm --filter @webhooks-cc/mcp build

      - name: Run tests
        run: pnpm --filter @webhooks-cc/mcp test

      # pnpm 10 does not reliably authenticate to the npm registry from CI
      # even with a fully-scoped NPM_TOKEN — it returns a misleading 404 on
      # PUT. Pack with pnpm so workspace:* deps get resolved to concrete
      # versions in the tarball, then publish the tarball with npm, which
      # picks up auth from setup-node's ~/.npmrc as expected.
      - name: Pack MCP
        run: pnpm --filter @webhooks-cc/mcp pack --pack-destination /tmp

      # Skipped when the version is already on npm, so a re-run after a failed
      # registry step does not stop here.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@webhooks-cc/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@webhooks-cc/mcp@$VERSION is already on npm; skipping"
          else
            npm publish /tmp/webhooks-cc-mcp-*.tgz --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The MCP Registry lists the server from server.json and checks it
      # against the package just published (mcpName in package.json); a unit
      # test keeps the two in sync. npm can take a moment to serve a new
      # version, hence the retries.
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        working-directory: packages/mcp
        run: |
          ../../mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ../../mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
