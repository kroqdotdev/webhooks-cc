name: CLA

# Pull requests from anyone but the maintainer need a signed CLA (CLA.md).
# Signatures are committed to the cla-signatures branch by the action.
# pull_request_target runs this file from main and never checks out the
# pull request's code, so it is safe to give the job a write token.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    # Dependabot's events get a read-only token, so its pull requests skip
    # the check (a skipped job satisfies a required check). Comments only
    # count on pull requests.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/kroqdotdev/webhooks-cc/blob/main/CLA.md
          branch: cla-signatures
          allowlist: kroqdotdev,dependabot[bot],*[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Contributions to webhooks.cc are accepted
            under a [Contributor License Agreement](https://github.com/kroqdotdev/webhooks-cc/blob/main/CLA.md):
            you keep the copyright, and the project may license your contribution on
            any terms. Please read it, then sign by posting the comment below. You
            only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA.
          signed-commit-message: "chore: $contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: "chore: create the CLA signature file"
