name: CLI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # The Rust code stores WHK_VERSION as a bare version string and prepends
      # "v" at every display site (e.g. `format!("v{version}")`). The tag name
      # already has a "v" prefix, so passing it through verbatim produced
      # "vv1.0.0" in --version output and `whk update`. Strip the prefix here.
      - name: Compute WHK_VERSION
        shell: bash
        run: echo "WHK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: apps/cli-rs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd apps/cli-rs/target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/whk-${{ github.ref_name }}-${{ matrix.target }}.tar.gz whk

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/cli-rs/target/${{ matrix.target }}/release/whk.exe" -DestinationPath "whk-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: whk-${{ matrix.target }}
          path: whk-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Releases before v1.0.0 were Go builds named whk_<goos>_<goarch>.<ext>,
      # and the v0.x self-updater downloads exactly that asset name (verified
      # against a matching checksums.txt line). Publish renamed copies of the
      # Rust archives so `whk update` still works from v0.x installs. The
      # archives are compatible: the Go updater extracts by binary base name
      # (whk / whk.exe), which is what the Rust archives contain.
      - name: Copy assets to legacy v0.x names
        run: |
          cp "whk-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz" whk_darwin_arm64.tar.gz
          cp "whk-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz" whk_darwin_amd64.tar.gz
          cp "whk-$GITHUB_REF_NAME-aarch64-unknown-linux-gnu.tar.gz" whk_linux_arm64.tar.gz
          cp "whk-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" whk_linux_amd64.tar.gz
          cp "whk-$GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip" whk_windows_amd64.zip

      - name: Generate checksums
        run: sha256sum whk-* whk_* > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        run: cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            whk-*
            whk_*
            checksums.txt
            checksums.txt.sigstore.json
          generate_release_notes: true

      - name: Keep checksums for the tap
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums.txt

  # Points the Homebrew tap (kroqdotdev/homebrew-tap, whk.rb) at this release,
  # so `brew install kroqdotdev/tap/whk` never falls behind. Pushes with the
  # HOMEBREW_TAP_DEPLOY_KEY secret: the private half of a deploy key with write
  # access to the tap repository only. Without it the job says so and does
  # nothing; prereleases never reach the tap.
  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Decide
        id: decide
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the Homebrew tap was not updated."
          elif ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is not a plain release; the tap stays as it is."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.decide.outputs.version != ''
        with:
          sparse-checkout: .github/scripts

      - uses: actions/checkout@v7
        if: steps.decide.outputs.version != ''
        with:
          repository: kroqdotdev/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.version != ''
        with:
          name: checksums

      - name: Update the formula
        if: steps.decide.outputs.version != ''
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          # A patch release on an older line must not move the tap backwards.
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/whk.rb)"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "The tap has whk $current, newer than $VERSION; it stays as it is."
            exit 0
          fi
          .github/scripts/homebrew-formula.sh "$VERSION" checksums.txt > tap/whk.rb
          cd tap
          if git diff --quiet; then
            echo "The tap already has whk $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "whk $VERSION"
          git push origin HEAD
