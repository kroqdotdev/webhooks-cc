name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Format with Prettier
        run: pnpm format

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_WEBHOOK_URL || 'https://go.example.test' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.test' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          RECEIVER_INTERNAL_URL: ${{ vars.RECEIVER_INTERNAL_URL || 'http://localhost:3001' }}
          CAPTURE_SHARED_SECRET: ${{ secrets.CAPTURE_SHARED_SECRET || 'ci-placeholder-capture-shared-secret' }}

  test-ts:
    name: Test SDK / MCP / Web Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root turbo `test` runs the SDK vitest, MCP vitest, and the web unit
      # vitest (vitest.unit.config.ts). The web unit suite is import-only and
      # needs no live database. The web INTEGRATION + E2E suites require a live
      # Supabase instance and are run pre-merge locally, so they are
      # intentionally not in CI (yet).
      - name: Run tests
        run: pnpm test
        env:
          NEXT_PUBLIC_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_WEBHOOK_URL || 'https://go.example.test' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.test' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          CAPTURE_SHARED_SECRET: ${{ secrets.CAPTURE_SHARED_SECRET || 'ci-placeholder-capture-shared-secret' }}

  build-cli:
    name: Build Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Build
        run: cargo build
        working-directory: apps/cli-rs

  test-cli:
    name: Test Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Run tests
        run: cargo test --verbose
        working-directory: apps/cli-rs

  build-rust:
    name: Build Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build
        working-directory: apps/receiver-rs

  test-rust:
    name: Test Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose
        working-directory: apps/receiver-rs

  lint-rust:
    name: Lint Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/receiver-rs

  lint-cli:
    name: Lint Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/cli-rs
