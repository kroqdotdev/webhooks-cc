name: CI

# Every job only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Format with Prettier
        run: pnpm format:check

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_WEBHOOK_URL || 'https://go.example.test' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.test' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          RECEIVER_INTERNAL_URL: ${{ vars.RECEIVER_INTERNAL_URL || 'http://localhost:3001' }}
          CAPTURE_SHARED_SECRET: ${{ secrets.CAPTURE_SHARED_SECRET || 'ci-placeholder-capture-shared-secret' }}

  test-ts:
    name: Test SDK / MCP / Web Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root turbo `test` runs the SDK vitest, MCP vitest, and the web unit
      # vitest (vitest.unit.config.ts). The web unit suite is import-only and
      # needs no live database. The web INTEGRATION + E2E suites require a live
      # Supabase instance and are run pre-merge locally, so they are
      # intentionally not in CI (yet).
      - name: Run tests
        run: pnpm test
        env:
          NEXT_PUBLIC_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_WEBHOOK_URL || 'https://go.example.test' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.test' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          CAPTURE_SHARED_SECRET: ${{ secrets.CAPTURE_SHARED_SECRET || 'ci-placeholder-capture-shared-secret' }}

  test-python:
    name: Test Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports, and the newest.
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      # Includes the shared conformance vectors in packages/sdk/conformance.
      - name: Run tests
        run: uv run pytest

  test-go:
    name: Test Go SDK (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go the module supports (go.mod), and the newest.
        go: ["1.25", "stable"]
    defaults:
      run:
        working-directory: packages/sdk-go
    env:
      # Missing conformance vectors fail here instead of being skipped.
      WHK_CONFORMANCE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      # Includes the shared conformance vectors in packages/sdk/conformance.
      - name: Run tests
        run: go test -race ./...

  build-cli:
    name: Build Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Build
        run: cargo build
        working-directory: apps/cli-rs

  test-cli:
    name: Test Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Run tests
        run: cargo test --verbose
        working-directory: apps/cli-rs

  build-rust:
    name: Build Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build
        working-directory: apps/receiver-rs

  test-rust:
    name: Test Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose
        working-directory: apps/receiver-rs

  lint-rust:
    name: Lint Rust Receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/receiver-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/receiver-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/receiver-rs

  test-mx:
    name: Test Rust MX Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mx-rs/target
          key: ${{ runner.os }}-cargo-mx-${{ hashFiles('apps/mx-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mx-

      - name: Run tests
        run: cargo test --locked
        working-directory: apps/mx-rs

  lint-mx:
    name: Lint Rust MX Listener
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mx-rs/target
          key: ${{ runner.os }}-cargo-mx-${{ hashFiles('apps/mx-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mx-

      - name: Check formatting
        run: cargo fmt --check
        working-directory: apps/mx-rs

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/mx-rs

  # The integration tests run the built binary, so they also check that the
  # seccomp filter and the rlimits hold on the runner.
  test-parser:
    name: Test Rust Attachment Parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/parser-rs/target
          key: ${{ runner.os }}-cargo-parser-${{ hashFiles('apps/parser-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-parser-

      - name: Run tests
        run: cargo test --locked
        working-directory: apps/parser-rs

  lint-parser:
    name: Lint Rust Attachment Parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/parser-rs/target
          key: ${{ runner.os }}-cargo-parser-${{ hashFiles('apps/parser-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-parser-

      - name: Check formatting
        run: cargo fmt --check
        working-directory: apps/parser-rs

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/parser-rs

  lint-cli:
    name: Lint Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli-rs/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('apps/cli-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/cli-rs

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Production runs these images, built by the deploy in a separate
    # repository. This job only checks that they still build; nothing is
    # pushed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            file: apps/web/Dockerfile
          - image: receiver
            context: apps/receiver-rs
            file: apps/receiver-rs/Dockerfile
          - image: mx
            context: apps/mx-rs
            file: apps/mx-rs/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
