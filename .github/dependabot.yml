version: 2
updates:
  # JavaScript/TypeScript dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    labels:
      - "dependencies"
      - "release: none"
      - "javascript"

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/apps/cli-rs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "release: none"
      - "rust"

  - package-ecosystem: "cargo"
    directory: "/apps/receiver-rs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "release: none"
      - "rust"

  # Python SDK (uv.lock); the runtime dependency ranges in pyproject.toml are
  # what users get, so only the lock moves here.
  - package-ecosystem: "uv"
    directory: "/packages/sdk-python"
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release: none"
      - "python"

  # pytest plugin (uv.lock); as for the Python SDK, only the lock moves. It
  # holds webhooks-cc from PyPI, so this is also what moves the plugin's tests
  # to each new SDK release.
  - package-ecosystem: "uv"
    directory: "/packages/pytest-webhooks-cc"
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release: none"
      - "python"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "release: none"
      - "github-actions"

  # Docker
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "release: none"
      - "docker"
    # Production runs Node 24 LTS; move to a new major on purpose, not by bot.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/receiver-rs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "release: none"
      - "docker"
