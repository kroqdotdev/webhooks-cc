# Paths left out of secret scanning and push protection. They hold made-up
# credentials that look real on purpose (Stripe-style whsec_ secrets, signed
# vectors), and conformance vectors are regenerated whenever signing changes,
# which push protection would otherwise block. Real secrets never belong in
# any of these paths; production code paths stay scanned.
paths-ignore:
  # Signing and verification vectors shared by every SDK and the receiver
  - "packages/sdk/conformance/**"
  - "apps/web/lib/forwarding/chat-vectors.json"
  # TypeScript unit tests beside the code, and the web integration and e2e suites
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "apps/web/tests/**"
  # Rust test modules and integration tests
  - "apps/*/src/tests/**"
  - "apps/*/tests/**"
  # Python and Go SDK tests
  - "packages/sdk-python/tests/**"
  - "packages/sdk-go/**/*_test.go"
